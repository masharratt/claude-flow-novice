openapi: 3.0.3
info:
  title: Claude Flow Novice API
  version: 1.0.0
  description: API for React Portal Integration

servers:
  - url: http://localhost:3456

paths:
  /api/swarms:
    get:
      summary: List all swarms
      operationId: listSwarms
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Swarm'
        '500':
          description: Internal server error

  /api/swarms/{taskId}:
    get:
      summary: Get specific swarm by task ID
      operationId: getSwarmByTaskId
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swarm'
        '404':
          description: Swarm not found
        '500':
          description: Internal server error

  /api/health:
    get:
      summary: Check API health
      operationId: checkHealth
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"

  /api/agents:
    get:
      summary: List all agents
      operationId: listAgents
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
                  total:
                    type: integer
        '400':
          description: Invalid pagination parameters
        '500':
          description: Internal server error

  /api/agents/{id}:
    get:
      summary: Get agent by ID
      operationId: getAgentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found
        '500':
          description: Internal server error

  /api/agents/{id}/intervene:
    post:
      summary: Intervene in agent process
      operationId: interveneAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: ['pause', 'resume', 'cancel']
      responses:
        '200':
          description: Intervention successful
        '400':
          description: Invalid intervention action
        '404':
          description: Agent not found
        '500':
          description: Internal server error

  /api/messages:
    get:
      summary: List messages
      operationId: listMessages
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  total:
                    type: integer
        '400':
          description: Invalid pagination parameters
        '500':
          description: Internal server error

  /api/messages/{id}:
    get:
      summary: Get message by ID
      operationId: getMessageById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Message not found
        '500':
          description: Internal server error

  /api/decisions:
    get:
      summary: List decisions
      operationId: listDecisions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
                  total:
                    type: integer
        '400':
          description: Invalid pagination parameters
        '500':
          description: Internal server error

  /api/decisions/{id}:
    get:
      summary: Get decision by ID
      operationId: getDecisionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '404':
          description: Decision not found
        '500':
          description: Internal server error

  /api/metrics:
    get:
      summary: Retrieve system metrics
      operationId: getMetrics
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '500':
          description: Internal server error

  /api/performance:
    get:
      summary: Get system performance details
      operationId: getPerformance
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
        '500':
          description: Internal server error

  /api/filters:
    post:
      summary: Create a new filter
      operationId: createFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterInput'
      responses:
        '201':
          description: Filter created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          description: Invalid filter configuration
        '500':
          description: Internal server error

  /api/filters/{id}:
    get:
      summary: Get filter by ID
      operationId: getFilterById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '404':
          description: Filter not found
        '500':
          description: Internal server error

components:
  schemas:
    Swarm:
      type: object
      properties:
        taskId:
          type: string
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        status:
          type: string

    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        confidence:
          type: number
          format: float

    Message:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time

    Decision:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        details:
          type: object
        confidence:
          type: number
          format: float

    Metrics:
      type: object
      properties:
        cpuUsage:
          type: number
          format: float
        memoryUsage:
          type: number
          format: float
        activeAgents:
          type: integer

    Performance:
      type: object
      properties:
        averageResponseTime:
          type: number
          format: float
        throughput:
          type: number
          format: float
        errorRate:
          type: number
          format: float

    FilterInput:
      type: object
      properties:
        type:
          type: string
        criteria:
          type: object

    Filter:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        criteria:
          type: object
        createdAt:
          type: string
          format: date-time