version: '3.8'

# HashiCorp Vault Integration for CFN Secrets Management
# Part of IMPL-001 Security Hardening - Stream 1
#
# Dev Mode Configuration (for development/testing)
# Production deployment requires:
# - Persistent storage backend (Consul/etcd/Raft)
# - TLS certificates
# - Auto-unseal via cloud KMS
# - High availability (3+ nodes)
# - Audit logging
# - Network policies
#
# See: docs/VAULT_INTEGRATION_GUIDE.md for production setup

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: cfn-vault
    restart: unless-stopped

    ports:
      - "8200:8200"

    environment:
      # Dev mode configuration (NOT for production)
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_ROOT_TOKEN:-dev-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"

      # Logging
      VAULT_LOG_LEVEL: "${VAULT_LOG_LEVEL:-info}"

    cap_add:
      - IPC_LOCK

    volumes:
      # Vault configuration
      - ./config/vault:/vault/config:ro

      # Policies and scripts
      - ./scripts/vault:/vault/scripts:ro

      # Logs (dev mode only)
      - vault-logs:/vault/logs

      # File audit backend (dev mode only)
      - vault-audit:/vault/audit

    command: server -dev -dev-root-token-id="${VAULT_ROOT_TOKEN:-dev-root-token}"

    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - cfn-network

    labels:
      com.cfn.service: "vault"
      com.cfn.security: "secrets-management"
      com.cfn.version: "1.15"

  # Vault UI (optional, for development)
  vault-ui:
    image: djenriquez/vault-ui:latest
    container_name: cfn-vault-ui
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      VAULT_URL_DEFAULT: "http://vault:8200"
      VAULT_AUTH_DEFAULT: "TOKEN"

    depends_on:
      vault:
        condition: service_healthy

    networks:
      - cfn-network

    labels:
      com.cfn.service: "vault-ui"
      com.cfn.security: "development-only"

volumes:
  vault-logs:
    driver: local
    labels:
      com.cfn.data: "vault-logs"

  vault-audit:
    driver: local
    labels:
      com.cfn.data: "vault-audit"

networks:
  cfn-network:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-cfn}_default

