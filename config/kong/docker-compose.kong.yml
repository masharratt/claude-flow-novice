version: '3.8'

# Kong API Gateway Configuration for CFN Loop
# High-performance API gateway with advanced security and monitoring
#
# Usage:
#   ./scripts/docker/run-in-worktree.sh -f config/kong/docker-compose.kong.yml up -d

services:
  # Kong Database (PostgreSQL)
  kong-database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KONG_DATABASE_NAME:-kong}
      POSTGRES_USER: ${KONG_DATABASE_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong_password}
      POSTGRES_INITDB_ARGS: "-c password_encryption=scram-sha-256"
    volumes:
      - kong-data:/var/lib/postgresql/data
    networks:
      - kong-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_DATABASE_USER:-kong} -d ${KONG_DATABASE_NAME:-kong}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Kong Database Migration
  kong-migration:
    image: kong:3.5
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_DATABASE_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong_password}
      KONG_PG_DATABASE: ${KONG_DATABASE_NAME:-kong}
      KONG_PG_PORT: 5432
    depends_on:
      - kong-database
    networks:
      - kong-network
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Kong Gateway (Main API Gateway)
  kong:
    image: kong:3.5
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_DATABASE_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong_password}
      KONG_PG_DATABASE: ${KONG_DATABASE_NAME:-kong}
      KONG_PG_PORT: 5432
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_VITALS: postgres
      KONG_VITALS_PG_HOST: kong-database
      KONG_VITALS_PG_USER: ${KONG_DATABASE_USER:-kong}
      KONG_VITALS_PG_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong_password}
      KONG_VITALS_PG_DATABASE: ${KONG_DATABASE_NAME:-kong}
      KONG_PORTAL: off
      KONG_PORTAL_GUI_PROTOCOL: http
      KONG_PORTAL_GUI_HOST: localhost:8003
      KONG_SSL_CERT: /etc/kong/ssl/kong.crt
      KONG_SSL_CERT_KEY: /etc/kong/ssl/kong.key
      KONG_NGINX_DAEMON: 'off'
    ports:
      - "${KONG_PROXY_HTTP_PORT:-8080}:8000"
      - "${KONG_PROXY_HTTPS_PORT:-8443}:8443"
      - "${KONG_ADMIN_API_PORT:-8001}:8001"
      - "${KONG_ADMIN_GUI_PORT:-8002}:8002"
      - "${KONG_ADMIN_GUI_SSL_PORT:-8444}:8444"
      - "${KONG_PORTAL_PORT:-8003}:8003"
      - "${KONG_PORTAL_SSL_PORT:-8445}:8445"
      - "${KONG_STREAM_LISTEN_PORT:-9100}:9100"
      - "${KONG_CLUSTERING_LISTEN_PORT:-7946}:7946"
    volumes:
      - ./config/kong/kong.yml:/kong/declarative/kong.yml:ro
      - ./config/kong/ssl:/etc/kong/ssl:ro
      - kong-log:/var/log/kong
    networks:
      - kong-network
      - cfn-network  # Connect to CFN network
    depends_on:
      kong-migration:
        condition: service_completed_successfully
      kong-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Kong Manager (Web UI)
  kong-manager:
    image: pantsel/konga
    restart: unless-stopped
    environment:
      NODE_ENV: development
      KONGA_HOOK_TIMEOUT: 10000
      KONGA_SSL_ENABLED: "false"
      KONGA_ADMIN_USER: ${KONG_ADMIN_USER:-admin}
      KONGA_ADMIN_PASSWORD: ${KONG_ADMIN_PASSWORD:-admin123}
      KONGA_SEED_USER_DATA_SOURCE_FILE: /app/konga-seed.json
      KONGA_DATABASE: postgres
      KONGA_PG_HOST: kong-database
      KONGA_PG_USER: ${KONG_DATABASE_USER:-kong}
      KONGA_PG_PASSWORD: ${KONG_DATABASE_PASSWORD:-kong_password}
      KONGA_PG_DATABASE: konga
    ports:
      - "${KONG_MANAGER_PORT:-1337}:1337"
    volumes:
      - konga-data:/app/konga-data
      - ./config/kong/konga-seed.json:/app/konga-seed.json:ro
    networks:
      - kong-network
    depends_on:
      - kong-database
      - kong
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Redis for Kong Rate Limiting and Caching
  kong-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - kong-redis-data:/data
    networks:
      - kong-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Prometheus for Kong Metrics
  kong-prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${KONG_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/kong/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kong-prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - kong-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Grafana for Kong Dashboard
  kong-grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${KONG_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${KONG_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${KONG_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: redis-datasource
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - kong-grafana-data:/var/lib/grafana
      - ./config/kong/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/kong/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - kong-network
    depends_on:
      - kong-prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

networks:
  kong-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
    labels:
      - kong.network=true
      
  # Connect to existing CFN network
  cfn-network:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-cfn}-cfn-network

volumes:
  kong-data:
    driver: local
    labels:
      - kong.volume=kong-data
  kong-redis-data:
    driver: local
    labels:
      - kong.volume=kong-redis-data
  konga-data:
    driver: local
    labels:
      - kong.volume=konga-data
  kong-prometheus-data:
    driver: local
    labels:
      - kong.volume=kong-prometheus-data
  kong-grafana-data:
    driver: local
    labels:
      - kong.volume=kong-grafana-data