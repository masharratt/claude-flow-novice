name: Coverage Report

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Weekly coverage report
    - cron: '0 0 * * 1'

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build TypeScript
        run: npm run build

      - name: Generate unit test coverage
        run: npm run test -- --coverage --forceExit --maxWorkers=2
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Generate integration test coverage
        run: npm run test:integration -- --coverage --forceExit --maxWorkers=4 2>/dev/null || true
        env:
          NODE_ENV: test

      - name: Merge coverage reports
        run: |
          if command -v nyc &> /dev/null; then
            npx nyc merge coverage merged-coverage.json
            npx nyc report --reporter=lcov --reporter=text --reporter=json
          else
            echo "nyc not available, using raw coverage reports"
          fi

      - name: Display coverage summary
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const summary = require('./coverage/coverage-summary.json').total;
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log(\`| Lines | \${summary.lines.pct.toFixed(2)}% |\`);
              console.log(\`| Statements | \${summary.statements.pct.toFixed(2)}% |\`);
              console.log(\`| Functions | \${summary.functions.pct.toFixed(2)}% |\`);
              console.log(\`| Branches | \${summary.branches.pct.toFixed(2)}% |\`);
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info,./coverage/coverage-final.json
          flags: full-coverage
          name: coverage-report
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            merged-coverage.json
          retention-days: 90

      - name: Comment PR with coverage badge
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage/coverage-summary.json')) {
              console.log('Coverage summary not found');
              return;
            }

            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;

            const getCoverageColor = (pct) => {
              if (pct >= 90) return 'brightgreen';
              if (pct >= 80) return 'green';
              if (pct >= 70) return 'yellowgreen';
              if (pct >= 60) return 'yellow';
              return 'red';
            };

            const linePct = summary.lines.pct.toFixed(2);
            const statementPct = summary.statements.pct.toFixed(2);
            const functionPct = summary.functions.pct.toFixed(2);
            const branchPct = summary.branches.pct.toFixed(2);

            const badges = `
            ![Lines](https://img.shields.io/badge/lines-${linePct}%25-${getCoverageColor(linePct)}?style=flat)
            ![Statements](https://img.shields.io/badge/statements-${statementPct}%25-${getCoverageColor(statementPct)}?style=flat)
            ![Functions](https://img.shields.io/badge/functions-${functionPct}%25-${getCoverageColor(functionPct)}?style=flat)
            ![Branches](https://img.shields.io/badge/branches-${branchPct}%25-${getCoverageColor(branchPct)}?style=flat)
            `;

            const gateStatus = (metricName, pct, threshold) => {
              return pct >= threshold ? '✅' : '⚠️';
            };

            const comment = `## Coverage Analysis

            ${badges}

            ### Detailed Metrics
            | Metric | Coverage | Threshold | Status |
            |--------|----------|-----------|--------|
            | Lines | ${linePct}% | 80% | ${gateStatus('Lines', linePct, 80)} |
            | Statements | ${statementPct}% | 80% | ${gateStatus('Statements', statementPct, 80)} |
            | Functions | ${functionPct}% | 80% | ${gateStatus('Functions', functionPct, 80)} |
            | Branches | ${branchPct}% | 75% | ${gateStatus('Branches', branchPct, 75)} |

            ### Gate Results
            ${linePct >= 80 && statementPct >= 80 && functionPct >= 80 && branchPct >= 75
              ? '✅ All coverage gates passed'
              : '⚠️ Some coverage gates below threshold'
            }

            [View detailed report on Codecov](https://app.codecov.io)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  critical-paths-coverage:
    name: Critical Paths Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build TypeScript
        run: npm run build

      - name: Run critical path tests
        run: |
          echo "Testing critical paths with strict coverage requirements..."

          npm run test -- \
            --testPathPattern="(orchestration|coordination|agent-spawning)" \
            --coverage \
            --coverageThreshold='{"global": {"lines": 85, "functions": 85, "statements": 85, "branches": 80}}' \
            --forceExit \
            --maxWorkers=2
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Archive critical paths coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-paths-coverage
          path: coverage/
          retention-days: 30

  coverage-trends:
    name: Coverage Trends
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build TypeScript
        run: npm run build

      - name: Generate current coverage
        run: npm run test -- --coverage --forceExit --maxWorkers=2
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Save coverage snapshot
        run: |
          mkdir -p .coverage-history
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          if [ -f "coverage/coverage-summary.json" ]; then
            cp coverage/coverage-summary.json ".coverage-history/coverage_${TIMESTAMP}.json"

            echo "Coverage snapshot saved: .coverage-history/coverage_${TIMESTAMP}.json"

            # Keep only last 30 snapshots
            ls -t .coverage-history/coverage_*.json 2>/dev/null | tail -n +31 | xargs rm -f 2>/dev/null || true
          fi

      - name: Analyze coverage trends
        run: |
          if [ -d ".coverage-history" ]; then
            echo "## Coverage Trends" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            LATEST=$(ls -t .coverage-history/coverage_*.json 2>/dev/null | head -1)
            if [ ! -z "$LATEST" ]; then
              node -e "
                const latest = require('./${LATEST}').total;
                console.log('### Latest Snapshot');
                console.log('- Lines: ' + latest.lines.pct.toFixed(2) + '%');
                console.log('- Statements: ' + latest.statements.pct.toFixed(2) + '%');
                console.log('- Functions: ' + latest.functions.pct.toFixed(2) + '%');
                console.log('- Branches: ' + latest.branches.pct.toFixed(2) + '%');
              " >> $GITHUB_STEP_SUMMARY
            fi
          fi

  coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: [ generate-coverage ]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-data

      - name: Generate badge SVG
        run: |
          if [ -f "coverage-data/coverage-summary.json" ]; then
            node -e "
              const summary = require('./coverage-data/coverage-summary.json').total;
              const pct = summary.lines.pct.toFixed(0);

              let color = 'brightgreen';
              if (pct < 80) color = 'yellow';
              if (pct < 70) color = 'red';

              const svg = \`<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"110\" height=\"20\">
                <linearGradient id=\"b\" x2=\"0\" y2=\"100%\">
                  <stop offset=\"0\" stop-color=\"#bbb\" stop-opacity=\".1\"/>
                  <stop offset=\"1\" stop-opacity=\".1\"/>
                </linearGradient>
                <clipPath id=\"a\">
                  <rect width=\"110\" height=\"20\" rx=\"3\"/>
                </clipPath>
                <g clip-path=\"url(#a)\">
                  <path fill=\"#555\" d=\"M0 0h62v20H0z\"/>
                  <path fill=\"#${color === 'brightgreen' ? '4c1' : color === 'yellow' ? 'dfb113' : 'e05d44'}\" d=\"M62 0h48v20H62z\"/>
                  <path fill=\"url(#b)\" d=\"M0 0h110v20H0z\"/>
                </g>
                <g fill=\"#fff\" text-anchor=\"middle\" font-family=\"DejaVu Sans,Verdana,Geneva,sans-serif\" font-size=\"11\">
                  <text x=\"31\" y=\"15\" fill=\"#010101\" fill-opacity=\".3\">coverage</text>
                  <text x=\"31\" y=\"14\">coverage</text>
                  <text x=\"85\" y=\"15\" fill=\"#010101\" fill-opacity=\".3\">${pct}%</text>
                  <text x=\"85\" y=\"14\">${pct}%</text>
                </g>
              </svg>\`;

              require('fs').writeFileSync('coverage-badge.svg', svg);
              console.log('Coverage badge generated: ' + pct + '%');
            "
          fi

      - name: Commit badge
        run: |
          if [ -f "coverage-badge.svg" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            if git diff --quiet coverage-badge.svg; then
              echo "No badge changes"
            else
              git add coverage-badge.svg
              git commit -m "chore: update coverage badge" --allow-empty
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi
        continue-on-error: true
