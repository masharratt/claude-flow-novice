name: NPM Package Deployment

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  security-check:
    name: Security Check (API Keys Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: API Key Security Scan
        run: |
          echo "Scanning for API keys..."
          
          # Only check for API key patterns
          if git diff HEAD~1 HEAD | grep -iE "(api[_-]?key|sk-|Bearer [a-zA-Z0-9])" | grep -v "your_api_key_here" > /dev/null 2>&1; then
            echo "❌ API keys detected in commit"
            exit 1
          fi
          
          echo "✅ No API keys found"

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-check
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
