name: Security - Credential Scanning

on:
  push:
    branches: [ main, develop, 'feature/**', 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  credential-scan:
    name: Scan for Exposed Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reuse the repo's own pre-commit credential scanner (.claude/hooks/pre-commit),
      # the same engine that gates every local commit, instead of a parallel
      # git-secrets pattern list that drifts. The hook scans `git diff --cached`,
      # so soft-reset HEAD to an empty commit: every tracked file then counts as
      # staged and gets scanned.
      - name: Scan all tracked files with pre-commit scanner
        run: |
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          EMPTY_COMMIT=$(git -c user.name=ci -c user.email=ci@invalid commit-tree "$EMPTY_TREE" -m empty)
          git reset --soft "$EMPTY_COMMIT"
          bash .claude/hooks/pre-commit 2>&1 | tee scan-results.log
          exit "${PIPESTATUS[0]}"

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-scan-log
          path: scan-results.log
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('scan-results.log', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚨 Security Alert: Credentials Detected\n\n\`\`\`\n${report}\n\`\`\`\n\n**Action Required:** Remove credentials before merging.`
            });

  trufflehog-scan:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # No base/head: full-history scan every run. A base of default_branch
          # equals HEAD on pushes to main, which makes the action error out
          # with "BASE and HEAD commits are the same" before scanning anything.
          extra_args: --only-verified

  security-gate:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [credential-scan, trufflehog-scan]
    if: always()

    steps:
      - name: Check security gates
        run: |
          if [ "${{ needs.credential-scan.result }}" != "success" ] || [ "${{ needs.trufflehog-scan.result }}" != "success" ]; then
            echo "❌ Security gate FAILED"
            echo "credential-scan: ${{ needs.credential-scan.result }}"
            echo "trufflehog-scan: ${{ needs.trufflehog-scan.result }}"
            exit 1
          else
            echo "✅ Security gate PASSED"
          fi
