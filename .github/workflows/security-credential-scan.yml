name: Security - Credential Scanning

on:
  push:
    branches: [ main, develop, 'feature/**', 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  credential-scan:
    name: Scan for Exposed Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets
          sudo make install
          cd ..
          rm -rf git-secrets

      - name: Configure git-secrets patterns
        run: |
          # Initialize git-secrets
          git secrets --install --force

          # Anthropic API keys
          git secrets --add 'sk-ant-[a-zA-Z0-9_-]{40,}'

          # Z.ai API keys
          git secrets --add 'sk-zai-[a-zA-Z0-9._-]{20,}'
          git secrets --add '[a-zA-Z0-9]{32,}\.SUs3hnpAZAGsQDHX'
          git secrets --add '[a-zA-Z0-9]{32,}\.QO8R0JxF4fucsoWL'
          git secrets --add '[a-zA-Z0-9]{32,}\.gDXkwrMNlYcqE8mF'

          # NPM API keys
          git secrets --add 'npm_[a-zA-Z0-9]{36}'

          # Trigger.dev API keys
          git secrets --add 'tr_dev_[a-zA-Z0-9]{16,}'

          # Google API keys
          git secrets --add 'AIzaSy[a-zA-Z0-9_-]{33}'

          # XAi/Grok API keys
          git secrets --add 'xai-[a-zA-Z0-9]{32,}'
          git secrets --add 'grok-[a-zA-Z0-9]{32,}'

          # Generic secret patterns
          git secrets --add 'api_key\s*[:=]\s*["\']?[a-zA-Z0-9_-]{20,}'
          git secrets --add 'apiKey\s*[:=]\s*["\']?[a-zA-Z0-9_-]{20,}'
          git secrets --add 'auth_token\s*[:=]\s*["\']?[a-zA-Z0-9._-]{20,}'
          git secrets --add 'password\s*[:=]\s*["\']?[a-zA-Z0-9]{16,}'

          # Whitelist safe patterns
          git secrets --add --allowed '\[REDACTED\]'
          git secrets --add --allowed 'YOUR_API_KEY'
          git secrets --add --allowed 'YOUR_.*_KEY'
          git secrets --add --allowed 'example\.com'
          git secrets --add --allowed 'test[_-]?key'
          git secrets --add --allowed 'mock[_-]?key'
          git secrets --add --allowed 'sk-ant-mock'
          git secrets --add --allowed 'npm_MockTestKey'

      - name: Scan staged files for credentials
        run: |
          echo "🔍 Scanning staged files..."
          git secrets --scan || {
            echo "❌ Credentials detected in staged files!"
            exit 1
          }

      - name: Scan commit messages for credentials
        run: |
          echo "🔍 Scanning commit messages..."
          git secrets --scan-history --since=HEAD~10 || {
            echo "❌ Credentials detected in recent commit messages!"
            exit 1
          }

      - name: Scan working directory with custom scanner
        run: |
          echo "🔍 Running custom credential scanner..."

          # Make scanner executable
          chmod +x .claude/hooks/validators/credential-scanner.sh

          # Scan all tracked files
          findings=0
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              if ! .claude/hooks/validators/credential-scanner.sh "$file" "ci-workflow" 2>&1 | tee -a scan-results.log; then
                findings=$((findings + 1))
              fi
            fi
          done < <(git ls-files)

          if [ $findings -gt 0 ]; then
            echo ""
            echo "❌ SECURITY GATE FAILED: $findings file(s) contain credentials"
            echo ""
            cat scan-results.log
            exit 1
          else
            echo "✅ No credentials detected in $files_scanned files"
          fi

      - name: Generate security report
        if: always()
        run: |
          {
            echo "# Credential Scan Report"
            echo ""
            echo "**Date:** $(date -Iseconds)"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Triggered by:** ${{ github.event_name }}"
            echo ""
            echo "## Scan Results"
            echo ""
            if [ -f scan-results.log ]; then
              cat scan-results.log
            else
              echo "✅ No credentials detected"
            fi
            echo ""
            echo "## git-secrets Status"
            git secrets --list || echo "No patterns configured"
          } > security-scan-report.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: security-scan-report.md
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('security-scan-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚨 Security Alert: Credentials Detected\n\n${report}\n\n**Action Required:** Remove credentials before merging.`
            });

  trufflehog-scan:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  security-gate:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [credential-scan, trufflehog-scan]
    if: always()

    steps:
      - name: Check security gates
        run: |
          if [ "${{ needs.credential-scan.result }}" != "success" ] || [ "${{ needs.trufflehog-scan.result }}" != "success" ]; then
            echo "❌ Security gate FAILED"
            echo "credential-scan: ${{ needs.credential-scan.result }}"
            echo "trufflehog-scan: ${{ needs.trufflehog-scan.result }}"
            exit 1
          else
            echo "✅ Security gate PASSED"
          fi
