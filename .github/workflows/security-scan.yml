name: Security Scan - API Keys Only

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-key-scan:
    name: Scan for Exposed API Keys
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for API keys and secrets
        run: |
          # Install TruffleHog
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

          # Scan git history for secrets (only verified, high entropy)
          if git log --oneline | head -1 > /dev/null 2>&1; then
            trufflehog git file://. \
              --only-verified \
              --json \
              --fail \
              --no-update || {
                echo "⚠️  TruffleHog found verified secrets"
                echo "This is informational only - custom API key check will run next"
              }
          fi

      - name: Custom API key pattern check
        run: |
          echo "Scanning for common API key patterns..."

          # Define API key patterns to check
          PATTERNS=(
            "ANTHROPIC_API_KEY"
            "OPENAI_API_KEY"
            "api[_-]?key\s*=\s*['\"][a-zA-Z0-9]{20,}['\"]"
            "sk-[a-zA-Z0-9]{20,}"
            "Bearer [a-zA-Z0-9_\-\.]{20,}"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if git diff --cached -U0 | grep -iE "$pattern" > /dev/null 2>&1; then
              echo "⚠️  Found potential API key pattern: $pattern"
              git diff --cached -U0 | grep -iE "$pattern" --color=always
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "❌ Security violation: API keys detected in staged changes"
            echo "Remove API keys from code and use environment variables instead"
            exit 1
          else
            echo "✅ No API keys found in staged changes"
          fi

      - name: Check environment files
        run: |
          echo "Checking for API keys in environment files..."

          # Only fail if .env files are committed (not ignored)
          if git ls-files | grep -E "\.env$" > /dev/null 2>&1; then
            echo "❌ Security violation: .env file committed to repository"
            echo "Add .env to .gitignore and remove from git:"
            echo "  git rm --cached .env"
            echo "  echo '.env' >> .gitignore"
            exit 1
          fi

          # Check if .env.example has actual values
          if [ -f ".env.example" ]; then
            if grep -E "api[_-]?key\s*=\s*['\"]?[a-zA-Z0-9]{20,}" .env.example > /dev/null 2>&1; then
              echo "⚠️  Warning: .env.example contains actual API key values"
              echo "Replace with placeholders like: API_KEY=your_api_key_here"
            fi
          fi

          echo "✅ Environment file check passed"

      - name: Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Security Scan Complete - No API Key Violations"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Checked for:"
          echo "  • Anthropic API keys"
          echo "  • OpenAI API keys"
          echo "  • Generic API key patterns"
          echo "  • Bearer tokens"
          echo "  • Committed .env files"
          echo ""
          echo "All checks passed. Safe to deploy."
