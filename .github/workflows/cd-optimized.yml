name: Optimized Deployment Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cd-optimized.yml'
  workflow_run:
    workflows: [ "Optimized CI Pipeline" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment even if CI failed'
        required: false
        default: false
        type: boolean

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_CACHE_VERSION: 'v1'
  DEPLOYMENT_TIMEOUT: '1800' # 30 minutes

jobs:
  # Pre-deployment validation and setup
  deployment-setup:
    name: Deployment Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-deploy: ${{ steps.checks.outputs.should-deploy }}
      ci-status: ${{ steps.checks.outputs.ci-status }}
      build-exists: ${{ steps.checks.outputs.build-exists }}
      deploy-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CI status
        id: checks
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            CI_STATUS="${{ github.event.workflow_run.conclusion }}"
            echo "ci-status=$CI_STATUS" >> $GITHUB_OUTPUT
            
            if [ "$CI_STATUS" == "success" ] || [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
              echo "should-deploy=true" >> $GITHUB_OUTPUT
            else
              echo "should-deploy=false" >> $GITHUB_OUTPUT
              echo "CI failed, skipping deployment (use force_deploy to override)"
              exit 0
            fi
          else
            echo "ci-status=manual" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for build artifacts
        id: build-check
        run: |
          # Check if we have recent build artifacts
          if curl -s -f \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=build-artifact&per_page=1" \
            | jq '.artifacts | length > 0' > /dev/null; then
            echo "build-exists=true" >> $GITHUB_OUTPUT
          else
            echo "build-exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate deployment version
        id: version
        run: |
          VERSION="${{ github.sha }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${VERSION}-manual-$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Build deployment package (only if needed)
  build-deployment:
    name: Build Deployment Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deployment-setup
    if: needs.deployment-setup.outputs.should-deploy == 'true' && needs.deployment-setup.outputs.build-exists == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ env.CI_CACHE_VERSION }}-deps-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-deps-

      - name: Install and build
        run: |
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp -r claude-assets deploy-package/ || true
          cp package.json deploy-package/
          cp package-lock.json deploy-package/
          echo "Build: ${{ needs.deployment-setup.outputs.deploy-version }}" > deploy-package/BUILD_INFO
          echo "Timestamp: $(date -u)" >> deploy-package/BUILD_INFO
          tar -czf deployment-package-${{ needs.deployment-setup.outputs.deploy-version }}.tar.gz deploy-package/

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment-package-${{ needs.deployment-setup.outputs.deploy-version }}.tar.gz
          retention-days: 7

  # Staging deployment with fast rollback
  staging-deployment:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deployment-setup
    if: |
      needs.deployment-setup.outputs.should-deploy == 'true' && 
      (github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL || 'https://staging.example.com' }}
    outputs:
      staging-success: ${{ steps.deploy.outcome }}
      staging-url: ${{ secrets.STAGING_URL }}
    steps:
      - name: Download or build deployment package
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-artifact/
        continue-on-error: true

      - name: Download custom deployment package (fallback)
        if: failure()
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: ./

      - name: Extract deployment package
        run: |
          if [ -d "build-artifact" ]; then
            mkdir -p staging-deploy
            cp -r build-artifact/* staging-deploy/
            PACKAGE_NAME="staging-deployment-${{ needs.deployment-setup.outputs.deploy-version }}"
          else
            tar -xzf deployment-package-*.tar.gz
            mv deploy-package staging-deploy
            PACKAGE_NAME="staging-deployment-${{ needs.deployment-setup.outputs.deploy-version }}"
          fi
          tar -czf "$PACKAGE_NAME".tar.gz staging-deploy/
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Deploy to staging
        id: deploy
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "⚠️  Staging secrets not configured. Creating deployment package only."
            echo "Configure STAGING_HOST, STAGING_USER, and STAGING_DEPLOY_KEY to enable."
            exit 0
          fi

          echo "Deploying $PACKAGE_NAME to staging..."

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # Upload package
          scp -i ~/.ssh/deploy_key "$PACKAGE_NAME".tar.gz \
            $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          # Deploy with zero-downtime strategy
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY_SCRIPT'
          set -e
          PACKAGE_NAME="${PACKAGE_NAME}"
          DEPLOY_DIR="/opt/claude-flow-novice-staging"
          BACKUP_DIR="/opt/backups/staging-$(date +%Y%m%d_%H%M%S)"

          echo "Starting staging deployment..."

          # Create backup if current deployment exists
          if [ -d "$DEPLOY_DIR" ]; then
            mkdir -p "$(dirname "$BACKUP_DIR")"
            cp -r "$DEPLOY_DIR" "$BACKUP_DIR"
            echo "✅ Backup created: $BACKUP_DIR"
          fi

          # Extract new deployment
          cd /tmp
          tar -xzf "$PACKAGE_NAME".tar.gz
          
          # Prepare deployment directory
          mkdir -p "$DEPLOY_DIR.new"
          cp -r staging-deploy/* "$DEPLOY_DIR.new/"
          
          # Install production dependencies
          cd "$DEPLOY_DIR.new"
          npm ci --production --prefer-offline --silent
          
          # Health check new deployment
          if npm run health-check 2>/dev/null; then
            echo "✅ Health check passed"
          else
            echo "⚠️  Health check failed, but continuing"
          fi

          # Atomic switch
          mv "$DEPLOY_DIR" "$DEPLOY_DIR.old" 2>/dev/null || true
          mv "$DEPLOY_DIR.new" "$DEPLOY_DIR"
          rm -rf "$DEPLOY_DIR.old"

          # Restart service
          if command -v systemctl &> /dev/null; then
            systemctl restart claude-flow-staging || true
            sleep 5
            if systemctl is-active --quiet claude-flow-staging; then
              echo "✅ Service restarted successfully"
            else
              echo "⚠️  Service restart failed"
            fi
          fi

          # Cleanup old backups (keep last 5)
          find /opt/backups -name "staging-*" -type d | sort -r | tail -n +6 | xargs rm -rf 2>/dev/null || true

          echo "✅ Staging deployment completed"
          DEPLOY_SCRIPT

          rm ~/.ssh/deploy_key

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          if [ -z "$STAGING_URL" ]; then
            echo "⚠️  STAGING_URL not configured, skipping health check"
            exit 0
          fi

          echo "Running smoke tests against $STAGING_URL..."
          for i in {1..10}; do
            if curl -f -s -m 10 "$STAGING_URL/health" > /dev/null 2>&1; then
              echo "✅ Staging health check passed (attempt $i)"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "❌ Staging health check failed after 10 attempts"
              exit 1
            fi
            echo "⏳ Waiting for staging to be ready... (attempt $i/10)"
            sleep 15
          done

      - name: Create deployment record
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.deploy.outcome }}';
            const emoji = status === 'success' ? '✅' : '⚠️';
            github.rest.commits.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${emoji} Staging Deployment: ${status.toUpperCase()}

            Deployment Details:
            - Version: ${{ needs.deployment-setup.outputs.deploy-version }}
            - Package: ${{ env.PACKAGE_NAME }}
            - Timestamp: $(date -u)
            - CI Status: ${{ needs.deployment-setup.outputs.ci-status }}

            Status: ${status === 'success' ? 'Live in staging' : 'Deployment failed'}
            `
            });

  # Production deployment with advanced rollback
  production-deployment:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deployment-setup, staging-deployment]
    if: |
      needs.deployment-setup.outputs.should-deploy == 'true' && 
      (github.event.inputs.environment == 'production' || 
       (github.event_name == 'push' && needs.staging-deployment.outputs.staging-success == 'success'))
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL || 'https://example.com' }}
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-artifact/

      - name: Extract and prepare production package
        run: |
          mkdir -p prod-deploy
          cp -r build-artifact/* prod-deploy/
          echo "Build: ${{ needs.deployment-setup.outputs.deploy-version }}" > prod-deploy/BUILD_INFO
          echo "Environment: production" >> prod-deploy/BUILD_INFO
          echo "Timestamp: $(date -u)" >> prod-deploy/BUILD_INFO
          tar -czf prod-deployment-${{ needs.deployment-setup.outputs.deploy-version }}.tar.gz prod-deploy/
          echo "PROD_PACKAGE=prod-deployment-${{ needs.deployment-setup.outputs.deploy-version }}.tar.gz" >> $GITHUB_ENV

      - name: Pre-deployment verification
        run: |
          echo "Running pre-deployment checks..."
          
          # Verify package integrity
          if ! tar -tzf "$PROD_PACKAGE" | head -1 > /dev/null; then
            echo "❌ Deployment package is corrupted"
            exit 1
          fi
          
          echo "✅ Package integrity verified"

      - name: Create backup and deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "⚠️  Production secrets not configured. Package created but not deployed."
            echo "To deploy: scp $PROD_PACKAGE to production server"
            exit 0
          fi

          echo "Starting production deployment..."

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # Upload package
          scp -i ~/.ssh/deploy_key "$PROD_PACKAGE" \
            $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY_SCRIPT'
          set -e
          PROD_PACKAGE="${PROD_PACKAGE}"
          DEPLOY_DIR="/opt/claude-flow-novice"
          BACKUP_DIR="/opt/backups/claude-flow-novice_$(date +%Y%m%d_%H%M%S)"
          BLUE_DIR="${DEPLOY_DIR}-blue"
          GREEN_DIR="${DEPLOY_DIR}-green"
          CURRENT_LINK="${DEPLOY_DIR}-current"

          echo "Starting blue-green production deployment..."

          # Create backup
          if [ -d "$DEPLOY_DIR" ]; then
            mkdir -p "$(dirname "$BACKUP_DIR")"
            cp -r "$DEPLOY_DIR" "$BACKUP_DIR"
            echo "✅ Backup created: $BACKUP_DIR"
          fi

          # Extract new deployment
          cd /tmp
          tar -xzf "$PROD_PACKAGE"
          mkdir -p "$GREEN_DIR"
          cp -r prod-deploy/* "$GREEN_DIR/"

          # Install production dependencies
          cd "$GREEN_DIR"
          npm ci --production --prefer-offline --silent

          # Health check new deployment
          npm run health-check 2>/dev/null || echo "⚠️  Health check not available"

          # Determine which environment is currently active
          if [ -L "$CURRENT_LINK" ] && [[ "$(readlink $CURRENT_LINK)" == *"blue"* ]]; then
            CURRENT_COLOR="blue"
            NEW_COLOR="green"
          else
            CURRENT_COLOR="green"
            NEW_COLOR="blue"
          fi

          echo "Current: $CURRENT_COLOR, New: $NEW_COLOR"

          # Start new environment
          if [ -d "${DEPLOY_DIR}-$NEW_COLOR" ]; then
            rm -rf "${DEPLOY_DIR}-$NEW_COLOR"
          fi
          mv "$GREEN_DIR" "${DEPLOY_DIR}-$NEW_COLOR"

          # Switch traffic to new environment
          ln -sfn "${DEPLOY_DIR}-$NEW_COLOR" "$CURRENT_LINK"
          
          # Update service to use new deployment
          if command -v systemctl &> /dev/null; then
            # Create or update systemd service for current deployment
            cat << 'EOF' > /tmp/claude-flow-prod.service
          [Unit]
          Description=Claude Flow Novice Production
          After=network.target

          [Service]
          Type=simple
          User=claude-flow
          WorkingDirectory=${CURRENT_LINK}
          ExecStart=/usr/bin/node dist/index.js
          Restart=always
          RestartSec=10
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
          EOF

            sudo mv /tmp/claude-flow-prod.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable claude-flow-prod
            sudo systemctl restart claude-flow-prod
            
            echo "✅ Service restarted"
          fi

          # Wait for service to be ready
          sleep 10
          if systemctl is-active --quiet claude-flow-prod 2>/dev/null; then
            echo "✅ Production deployment successful"
          else
            echo "⚠️  Service status unknown"
          fi

          # Cleanup old environment
          if [ -d "${DEPLOY_DIR}-$CURRENT_COLOR" ]; then
            rm -rf "${DEPLOY_DIR}-$CURRENT_COLOR"
          fi

          # Cleanup old backups (keep last 10)
          find /opt/backups -name "claude-flow-novice_*" -type d | sort -r | tail -n +11 | xargs rm -rf 2>/dev/null || true

          echo "✅ Blue-green deployment completed successfully"
          DEPLOY_SCRIPT

          rm ~/.ssh/deploy_key

      - name: Extended post-deployment verification
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "⚠️  PRODUCTION_URL not configured"
            exit 0
          fi

          echo "Running extended production verification..."
          
          # Health checks with progressive backoff
          for i in {1..20}; do
            if curl -f -s -m 15 "$PROD_URL/health" > /dev/null 2>&1; then
              echo "✅ Production health check passed (attempt $i)"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "❌ Production health check failed after 20 attempts"
              exit 1
            fi
            BACKOFF=$((i * 2))
            echo "⏳ Waiting for production to be ready... (attempt $i/20, ${BACKOFF}s backoff)"
            sleep $BACKOFF
          done

      - name: Load testing (optional)
        if: github.event.inputs.environment == 'production'
        run: |
          PROD_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "⚠️  Skipping load test - no PRODUCTION_URL"
            exit 0
          fi

          echo "Running basic load test..."
          
          # Simple concurrent requests test
          for i in {1..10}; do
            curl -f -s -m 10 "$PROD_URL/health" &
          done
          wait
          
          echo "✅ Basic load test completed"

      - name: Automatic rollback on failure
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "❌ Cannot rollback: production secrets not configured"
            exit 1
          fi

          echo "🚨 Initiating automatic rollback..."

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'ROLLBACK_SCRIPT'
          set -e
          echo "Starting automatic rollback..."

          # Find latest backup
          LATEST_BACKUP=$(ls -td /opt/backups/claude-flow-novice_* 2>/dev/null | head -1)

          if [ -z "$LATEST_BACKUP" ]; then
            echo "❌ No backup found for rollback"
            exit 1
          fi

          echo "Restoring from: $LATEST_BACKUP"

          # Stop current service
          if command -v systemctl &> /dev/null; then
            systemctl stop claude-flow-prod || true
          fi

          # Restore from backup
          DEPLOY_DIR="/opt/claude-flow-novice"
          rm -rf "$DEPLOY_DIR"
          cp -r "$LATEST_BACKUP/claude-flow-novice" "$DEPLOY_DIR"

          # Restart service
          if command -v systemctl &> /dev/null; then
            systemctl start claude-flow-prod
            sleep 10
            
            if systemctl is-active --quiet claude-flow-prod; then
              echo "✅ Rollback completed successfully"
            else
              echo "❌ Rollback failed - service not starting"
              exit 1
            fi
          fi

          ROLLBACK_SCRIPT

          rm ~/.ssh/deploy_key

      - name: Create production deployment record
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const wasRolledBack = status === 'failure' && '${{ steps.rollback.outcome }}' === 'success';
            
            github.rest.commits.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `${emoji} Production Deployment: ${status.toUpperCase()}

            Deployment Details:
            - Version: ${{ needs.deployment-setup.outputs.deploy-version }}
            - Package: ${{ env.PROD_PACKAGE }}
            - Staging Status: ${{ needs.staging-deployment.outputs.staging-success }}
            - Timestamp: $(date -u)

            Status: ${status === 'success' ? 'Live in production' : 
                    wasRolledBack ? 'Failed - automatically rolled back' : 
                    'Deployment failed - manual intervention required'}

            ${wasRolledBack ? '🔄 Automatic rollback completed successfully' : ''}
            `
            });

  # Deployment summary and metrics
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deployment-setup, staging-deployment, production-deployment]
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # Optimized Deployment Pipeline Results

          ## Deployment Summary
          - **Trigger:** ${{ github.event_name }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Version:** ${{ needs.deployment-setup.outputs.deploy-version }}
          - **CI Status:** ${{ needs.deployment-setup.outputs.ci-status }}

          ## Environment Status
          - Staging: ${{ needs.staging-deployment.result }}
          - Production: ${{ needs.production-deployment.result }}

          ## Optimizations Applied
          - ✅ Blue-green deployment strategy for production
          - ✅ Zero-downtime deployments with atomic switches
          - ✅ Automatic rollback on deployment failure
          - ✅ Progressive health checks with backoff
          - ✅ Build artifact reuse from CI pipeline
          - ✅ Comprehensive backup management
          - ✅ Extended post-deployment verification

          ## Deployment Configuration
          To enable deployments, configure these secrets:
          - **Staging**: `STAGING_HOST`, `STAGING_USER`, `STAGING_DEPLOY_KEY`, `STAGING_URL`
          - **Production**: `PROD_HOST`, `PROD_USER`, `PROD_DEPLOY_KEY`, `PRODUCTION_URL`

          ## Performance Metrics
          - Deployment timeout: 30 minutes
          - Health check attempts: 20 with progressive backoff
          - Backup retention: 10 production, 5 staging backups
          - Package size: Optimized with production dependencies only

          EOF

      - name: Notify on deployment failure
        if: needs.production-deployment.result == 'failure'
        run: |
          echo "🚨 Production deployment failed - Check deployment logs for details"
          echo "Automatic rollback may have been initiated"