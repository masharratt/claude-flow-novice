name: Enhanced Security Scanning

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/security-enhanced.yml'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Daily security scans
    - cron: '0 1 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run npm audit
        continue-on-error: true
        run: |
          echo "Running npm audit..."
          npm audit --json > npm-audit-report.json || true

          # Parse and display results
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));

            if (report.metadata) {
              console.log('NPM Audit Results:');
              console.log('  Total vulnerabilities: ' + (report.metadata.vulnerabilities?.total || 0));
              console.log('  Critical: ' + (report.metadata.vulnerabilities?.critical || 0));
              console.log('  High: ' + (report.metadata.vulnerabilities?.high || 0));
              console.log('  Moderate: ' + (report.metadata.vulnerabilities?.moderate || 0));
              console.log('  Low: ' + (report.metadata.vulnerabilities?.low || 0));
            }
          "

      - name: Check for critical vulnerabilities
        run: |
          if npm audit --json 2>/dev/null | jq -e '.metadata.vulnerabilities.critical > 0' >/dev/null 2>&1; then
            echo "❌ Critical vulnerabilities found"
            npm audit
            exit 1
          else
            echo "✅ No critical vulnerabilities found"
          fi

      - name: Check for high severity vulnerabilities
        continue-on-error: true
        run: |
          HIGHS=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.high // 0')
          if [ "$HIGHS" -gt 0 ]; then
            echo "⚠️  Found $HIGHS high severity vulnerabilities"
            npm audit | grep -A5 "high severity"
          fi

      - name: Generate audit report
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # Dependency Audit Report

          EOF

          if [ -f "npm-audit-report.json" ]; then
            node -e "
              const fs = require('fs');
              const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
              const vulns = report.metadata?.vulnerabilities || {};

              console.log('## Vulnerability Summary');
              console.log('');
              console.log('| Severity | Count |');
              console.log('|----------|-------|');
              console.log('| Critical | ' + (vulns.critical || 0) + ' |');
              console.log('| High | ' + (vulns.high || 0) + ' |');
              console.log('| Moderate | ' + (vulns.moderate || 0) + ' |');
              console.log('| Low | ' + (vulns.low || 0) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint security checks
        continue-on-error: true
        run: |
          npm install -D eslint-plugin-security 2>/dev/null || true

          npx eslint src/**/*.ts \
            --config <(cat <<'ESLINTRC'
            {
              "parserOptions": {
                "ecmaVersion": 2020,
                "sourceType": "module"
              },
              "plugins": ["security"],
              "extends": ["plugin:security/recommended"],
              "rules": {
                "security/detect-eval-with-expression": "error",
                "security/detect-non-literal-regexp": "warn",
                "security/detect-unsafe-regex": "error",
                "security/detect-buffer-noassert": "error",
                "security/detect-child-process": "warn",
                "security/detect-disable-mustache-escape": "error",
                "security/detect-no-csrf-before-method-override": "error",
                "security/detect-non-literal-fs-filename": "warn",
                "security/detect-non-literal-require": "warn",
                "security/detect-object-injection": "off",
                "security/detect-possible-timing-attacks": "warn"
              }
            }
            ESLINTRC
            ) || echo "Security checks completed with warnings"

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."

          PATTERNS=(
            "password.*=.*['\"]"
            "api[_-]?key.*=.*['\"]"
            "secret.*=.*['\"]"
            "token.*=.*['\"]"
            "private[_-]?key"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -r "$pattern" src/ --include="*.ts" --include="*.js" 2>/dev/null | grep -v "example\|test\|mock" > /dev/null; then
              echo "⚠️  Potential hardcoded secret pattern found: $pattern"
              grep -r "$pattern" src/ --include="*.ts" --include="*.js" 2>/dev/null | head -5
            fi
          done

          echo "✅ Hardcoded secret check completed"

      - name: Dependency confusion check
        run: |
          echo "Checking for dependency confusion vulnerabilities..."

          # Check if package.json has scope
          if grep -q '"@' package.json; then
            echo "✅ Using scoped packages"
          fi

          # Check package-lock.json integrity
          if [ -f "package-lock.json" ]; then
            if npm audit --audit-level=moderate >/dev/null 2>&1; then
              echo "✅ Package lock integrity check passed"
            fi
          fi

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check licenses
        continue-on-error: true
        run: |
          npm install -D license-checker 2>/dev/null || true

          npx license-checker \
            --production \
            --excludePackages "claude-flow-novice" \
            --summary \
            --json > licenses.json || true

          if [ -f "licenses.json" ]; then
            echo "## License Summary"
            node -e "
              const fs = require('fs');
              const licenses = JSON.parse(fs.readFileSync('licenses.json', 'utf8'));
              const summary = {};

              Object.values(licenses).forEach(pkg => {
                const license = pkg.licenses || 'Unknown';
                summary[license] = (summary[license] || 0) + 1;
              });

              Object.entries(summary).forEach(([license, count]) => {
                console.log(license + ': ' + count + ' packages');
              });
            "
          fi

      - name: Check for problematic licenses
        continue-on-error: true
        run: |
          echo "Checking for problematic licenses..."

          PROBLEMATIC=("GPL" "AGPL" "SSPL")

          if [ -f "licenses.json" ]; then
            for license in "${PROBLEMATIC[@]}"; do
              if grep -i "$license" licenses.json > /dev/null; then
                echo "⚠️  Found potentially problematic license: $license"
                grep -i "$license" licenses.json | head -3
              fi
            done
          fi

          echo "✅ License compliance check completed"

      - name: Archive license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check npm package authenticity
        run: |
          echo "Verifying npm package signatures..."

          # Verify package-lock.json
          if [ -f "package-lock.json" ]; then
            npm ci --dry-run --prefer-offline 2>&1 | grep -i "warn\|error" || echo "✅ Package integrity verified"
          fi

      - name: Verify package publishers
        continue-on-error: true
        run: |
          echo "Checking for known package compromises..."

          # Check against known compromised packages
          npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities' || echo "No vulnerabilities detected"

      - name: Check for typosquatting
        continue-on-error: true
        run: |
          echo "Checking for potential typosquatted packages..."

          # List all dependencies
          npm list --depth=0 --json 2>/dev/null | jq '.dependencies | keys[]' | while read -r pkg; do
            # Simple heuristic: packages with unusual characters
            if echo "$pkg" | grep -qE '^[a-z0-9]{1,3}[_-]'; then
              echo "⚠️  Review package: $pkg"
            fi
          done || echo "Typosquatting check completed"

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan repository for secrets
        continue-on-error: true
        run: |
          echo "Scanning for secrets..."

          trufflehog git file://. \
            --only-verified \
            --json \
            --fail \
            --no-update \
            -o json > trufflehog-results.json || {
              echo "⚠️  TruffleHog scan completed"
              exit 0
            }

          echo "✅ No verified secrets detected"

      - name: Check for custom patterns
        run: |
          echo "Scanning for API key patterns..."

          PATTERNS=(
            "ANTHROPIC_API_KEY"
            "OPENAI_API_KEY"
            "api[_-]?key\s*=\s*['\"][a-zA-Z0-9]{20,}['\"]"
            "sk-[a-zA-Z0-9]{20,}"
            "Bearer [a-zA-Z0-9_\-\.]{20,}"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if git log --oneline -S "$pattern" --all 2>/dev/null | head -1 > /dev/null; then
              echo "⚠️  Found potential secret in git history: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "✅ No API keys found in git history"
          fi

      - name: Archive secret scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: trufflehog-results.json
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [ dependency-scan, sast-scan, license-check, supply-chain-security, secret-scan ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Generate security report
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # Security Scan Results

          ## Checks Performed
          - ✅ Dependency vulnerability scanning (npm audit)
          - ✅ Static application security testing (SAST)
          - ✅ License compliance
          - ✅ Supply chain security
          - ✅ Secret detection

          ## Overall Status
          EOF

          if [ "${{ needs.dependency-scan.result }}" = "success" ] && \
             [ "${{ needs.sast-scan.result }}" = "success" ] && \
             [ "${{ needs.license-check.result }}" = "success" ] && \
             [ "${{ needs.secret-scan.result }}" = "success" ]; then
            echo "✅ All security checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Some security checks require review" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create security issue if needed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## Security Alert

            A security scan detected issues that require attention:

            - Dependency scan: ${{ needs.dependency-scan.result }}
            - SAST scan: ${{ needs.sast-scan.result }}
            - License check: ${{ needs.license-check.result }}
            - Supply chain security: ${{ needs.supply-chain-security.result }}
            - Secret detection: ${{ needs.secret-scan.result }}

            Please review the workflow artifacts and security reports.

            See [security workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security Alert from Automated Scan',
              body: body,
              labels: ['security', 'automated']
            });
