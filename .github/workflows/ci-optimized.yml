name: Optimized CI Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.screenshots/**'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly tests
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global environment variables
env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  npm_config_cache: '/tmp/npm-cache'
  CI_CACHE_VERSION: 'v1'

jobs:
  # Build job that creates reusable artifacts
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      should-skip-tests: ${{ steps.changes.outputs.src == 'false' && steps.changes.outputs.package == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            src:
              - 'src/**'
            package:
              - 'package*.json'
            tests:
              - 'tests/**'
            docker:
              - 'docker/**'
              - 'Dockerfile*'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            /tmp/npm-cache
            node_modules
          key: ${{ env.CI_CACHE_VERSION }}-deps-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-deps-
            ${{ env.CI_CACHE_VERSION }}-deps-main

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit --ignore-scripts
          npm run prepare || true

      - name: Build TypeScript
        run: |
          npm run build
          echo "Build completed in $(date +%s)"

      - name: Create build artifact
        run: |
          mkdir -p build-artifact
          cp -r dist build-artifact/
          cp -r claude-assets build-artifact/ || true
          cp package.json build-artifact/
          cp package-lock.json build-artifact/
          echo "Build: ${{ github.sha }}" > build-artifact/BUILD_INFO
          echo "Timestamp: $(date -u)" >> build-artifact/BUILD_INFO

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build-artifact/
          retention-days: 7
          compression-level: 6

  # Parallel linting and security scanning
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: needs.build.outputs.should-skip-tests != 'true'
    strategy:
      fail-fast: false
      matrix:
        check: [lint, security, dependency-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-artifact/

      - name: Install dependencies
        run: |
          cp build-artifact/package*.json ./
          npm ci --prefer-offline --no-audit --ignore-scripts

      - name: Run ESLint and Type Check
        if: matrix.check == 'lint'
        run: |
          npm run lint 2>/dev/null || echo "Linting skipped - config not available"
          npm run typecheck

      - name: Run Security Scan
        if: matrix.check == 'security'
        run: |
          npm audit --json > security-audit.json || true
          # Process security results
          node -e "
            const audit = JSON.parse(require('fs').readFileSync('security-audit.json', 'utf8'));
            const vulns = audit.vulnerabilities || {};
            const high = Object.values(vulns).filter(v => v.severity === 'high').length;
            const critical = Object.values(vulns).filter(v => v.severity === 'critical').length;
            console.log(\`Security scan completed: \${high} high, \${critical} critical vulnerabilities\`);
            if (critical > 0) process.exit(1);
          "

      - name: Dependency Analysis
        if: matrix.check == 'dependency-scan'
        run: |
          npm ls --depth=2 || true
          echo "Dependency analysis completed"

  # Optimized test execution with parallel strategy
  test-matrix:
    name: Test Suite (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    if: needs.build.outputs.should-skip-tests != 'true'
    strategy:
      fail-fast: false
      matrix:
        test-type: [unit, integration, performance]
        node-version: ['18', '20']
        exclude:
          # Only run performance tests on Node 20
          - test-type: performance
            node-version: '18'
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cfn_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build-artifact/

      - name: Install dependencies
        run: |
          cp build-artifact/package*.json ./
          npm ci --prefer-offline --no-audit --ignore-scripts

      - name: Restore dist from build
        run: |
          cp -r build-artifact/dist ./
          cp -r build-artifact/claude-assets ./ 2>/dev/null || true

      - name: Cache test results
        uses: actions/cache@v3
        with:
          path: |
            coverage/
            test-results/
          key: ${{ env.CI_CACHE_VERSION }}-tests-${{ matrix.test-type }}-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CI_CACHE_VERSION }}-tests-${{ matrix.test-type }}-${{ matrix.node-version }}-

      - name: Run ${{ matrix.test-type }} tests
        run: |
          case "${{ matrix.test-type }}" in
            "unit")
              npm run test -- --coverage --forceExit --maxWorkers=2
              ;;
            "integration")
              npm run test:integration -- --coverage --forceExit --maxWorkers=4
              ;;
            "performance")
              npm run test:performance -- --forceExit --maxWorkers=2
              ;;
          esac
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cfn_test

      - name: Upload coverage reports
        if: matrix.test-type != 'performance'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: ${{ matrix.test-type }}-${{ matrix.node-version }}
          name: ${{ matrix.test-type }}-${{ matrix.node-version }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-type }}-${{ matrix.node-version }}
          path: |
            coverage/
            test-results/
          retention-days: 30

  # Consolidated coverage and quality gates
  coverage-gates:
    name: Coverage & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, quality-checks, test-matrix]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts
          pattern: test-results-*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install coverage merge tools
        run: npm install -g nyc

      - name: Merge coverage reports
        run: |
          mkdir -p merged-coverage
          find test-artifacts -name "coverage-final.json" -exec cp {} merged-coverage/ \;
          if [ $(ls merged-coverage/coverage-final.json 2>/dev/null | wc -l) -gt 0 ]; then
            npx nyc merge merged-coverage merged-coverage/coverage.json
            npx nyc report --reporter=json --reporter=text --reporter=lcov --report-dir=merged-coverage
          fi

      - name: Check coverage thresholds
        run: |
          if [ -f "merged-coverage/coverage-summary.json" ]; then
            LINES=$(jq '.total.lines.pct' merged-coverage/coverage-summary.json 2>/dev/null || echo "0")
            STATEMENTS=$(jq '.total.statements.pct' merged-coverage/coverage-summary.json 2>/dev/null || echo "0")
            FUNCTIONS=$(jq '.total.functions.pct' merged-coverage/coverage-summary.json 2>/dev/null || echo "0")
            BRANCHES=$(jq '.total.branches.pct' merged-coverage/coverage-summary.json 2>/dev/null || echo "0")

            echo "Coverage Results:"
            echo "  Lines:       ${LINES}%"
            echo "  Statements:  ${STATEMENTS}%"
            echo "  Functions:   ${FUNCTIONS}%"
            echo "  Branches:    ${BRANCHES}%"

            FAIL=0
            if (( $(echo "$LINES < 80" | bc -l) )); then echo "❌ Lines coverage ${LINES}% < 80%"; FAIL=1; fi
            if (( $(echo "$STATEMENTS < 80" | bc -l) )); then echo "❌ Statements coverage ${STATEMENTS}% < 80%"; FAIL=1; fi
            if (( $(echo "$FUNCTIONS < 80" | bc -l) )); then echo "❌ Functions coverage ${FUNCTIONS}% < 80%"; FAIL=1; fi
            if (( $(echo "$BRANCHES < 75" | bc -l) )); then echo "❌ Branches coverage ${BRANCHES}% < 75%"; FAIL=1; fi

            if [ $FAIL -eq 1 ]; then exit 1; fi
            echo "✅ All coverage gates passed"
          else
            echo "⚠️ No coverage reports found"
          fi

      - name: Upload merged coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./merged-coverage/coverage-final.json
          flags: merged
          name: merged-coverage
          fail_ci_if_error: false

      - name: PR Coverage Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('merged-coverage/coverage-summary.json')) {
              const summary = JSON.parse(fs.readFileSync('merged-coverage/coverage-summary.json', 'utf8'));
              const total = summary.total;
              const comment = `## Coverage Report

| Metric | Coverage | Status |
|--------|----------|--------|
| Lines | ${total.lines.pct.toFixed(2)}% | ${total.lines.pct >= 80 ? '✅' : '❌'} |
| Statements | ${total.statements.pct.toFixed(2)}% | ${total.statements.pct >= 80 ? '✅' : '❌'} |
| Functions | ${total.functions.pct.toFixed(2)}% | ${total.functions.pct >= 80 ? '✅' : '❌'} |
| Branches | ${total.branches.pct.toFixed(2)}% | ${total.branches.pct >= 75 ? '✅' : '❌'} |

**Thresholds:** Lines/Statements/Functions ≥80%, Branches ≥75%`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Pipeline summary and metrics
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, quality-checks, test-matrix, coverage-gates]
    if: always()
    steps:
      - name: Calculate pipeline metrics
        id: metrics
        run: |
          START_TIME="${{ github.event.created_at }}"
          END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          BUILD_STATUS="${{ needs.build.result }}"
          QUALITY_STATUS="${{ needs.quality-checks.result }}"
          TEST_STATUS="${{ needs.test-matrix.result }}"
          COVERAGE_STATUS="${{ needs.coverage-gates.result }}"
          
          OVERALL_STATUS="success"
          if [[ "$BUILD_STATUS" == "failure" || "$QUALITY_STATUS" == "failure" || "$TEST_STATUS" == "failure" || "$COVERAGE_STATUS" == "failure" ]]; then
            OVERALL_STATUS="failure"
          fi
          
          echo "status=$OVERALL_STATUS" >> $GITHUB_OUTPUT
          echo "build=$BUILD_STATUS" >> $GITHUB_OUTPUT
          echo "quality=$QUALITY_STATUS" >> $GITHUB_OUTPUT
          echo "tests=$TEST_STATUS" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE_STATUS" >> $GITHUB_OUTPUT

      - name: Create pipeline summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # Optimized CI Pipeline Results

          ## Execution Summary
          - **Workflow:** ${{ github.workflow }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Trigger:** ${{ github.event_name }}
          - **Status:** ${{ steps.metrics.outputs.status == 'success' && '✅ PASSED' || '❌ FAILED' }}

          ## Job Results
          - Build & Package: ${{ steps.metrics.outputs.build }}
          - Quality Checks: ${{ steps.metrics.outputs.quality }}
          - Test Matrix: ${{ steps.metrics.outputs.tests }}
          - Coverage Gates: ${{ steps.metrics.outputs.coverage }}

          ## Optimizations Applied
          - ✅ Parallel test execution across Node.js versions
          - ✅ Build artifact reuse across jobs
          - ✅ Intelligent dependency caching
          - ✅ Consolidated quality checks
          - ✅ Smart test selection based on file changes
          - ✅ Optimized service container usage

          ## Performance Metrics
          - Build cache hit: ${{ needs.build.outputs.cache-hit }}
          - Tests skipped: ${{ needs.build.outputs.should-skip-tests == 'true' && 'Yes (no changes)' || 'No' }}

          EOF

      - name: Notify on failure
        if: steps.metrics.outputs.status == 'failure'
        run: |
          echo "❌ Pipeline failed - Check individual job logs for details"