name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.screenshots/**'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly tests
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shell portability gate
        run: bash tests/test-shell-portability.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint 2>/dev/null || echo "Linting skipped - config not available"
        continue-on-error: true

      - name: Type checking
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [ '18', '20' ]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit -- --forceExit --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/unit/coverage-final.json
          flags: unittest
          name: unit-${{ matrix.node-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Clean build
        run: npm run clean

      - name: Build distribution
        run: npm run build

      - name: Verify build outputs
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ dist directory not created"
            exit 1
          fi

          if [ ! -f "dist/src/index.js" ]; then
            echo "❌ dist/src/index.js not found"
            exit 1
          fi

          echo "✅ Build verification passed"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, build-verification ]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Job Status Summary:"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Unit Tests: ${{ needs.unit-tests.result }}"
          echo "  Build Verification: ${{ needs.build-verification.result }}"

          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.build-verification.result }}" == "failure" ]]; then
            echo "❌ Quality gate failed"
            exit 1
          fi

          echo "✅ Quality gate passed"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [ quality-gate ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # CI Pipeline Results

          ## Summary
          - **Workflow:** ${{ github.workflow }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Status:** ${{ needs.quality-gate.result == 'success' && '✅ PASSED' || '❌ FAILED' }}

          ## Job Results
          - Lint & Type Check: Completed
          - Unit Tests: Completed
          - Build Verification: Completed

          EOF
