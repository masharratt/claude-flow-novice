name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'release/**' ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.screenshots/**'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly tests
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shell portability gate
        run: bash tests/test-shell-portability.sh

      - name: Shell syntax gate
        run: bash tests/test-shell-syntax.sh

      - name: Portable shim unit tests
        run: bash tests/test-portable-shims.sh

      - name: Global config linker tests
        run: bash tests/test-link-global-config.sh

      - name: Runtime dir linker tests
        run: bash tests/test-link-runtime-dirs.sh

      - name: Portability skill-ref unit tests
        run: bash tests/test-portability-skill-refs.sh

      # Resolves every skill script's root-anchor chain by executing it and
      # requires the landing dir to hold package.json + .git. Catches the
      # wrong-../-depth family that 921604f4d and the later skill
      # consolidations left behind, plus per-project anchors that must follow
      # CLAUDE_PROJECT_DIR instead of the shared CFN checkout.
      - name: Root resolution gate
        run: bash tests/test-root-resolution.sh

      - name: PROJECT_ROOT resolution regressions
        run: bash tests/test-project-root-resolution.sh

      - name: Path containment gate
        run: bash tests/security/test-path-containment.sh

      # Executes each script's assignment-only prefix to resolve every
      # 'source' target naming .claude, then requires the file to exist. This is
      # the gate for the class the skill consolidation created: scripts moved
      # into lib/<area>/ and into .claude/cfn-extras/ without their referrers
      # being updated, so a source line pointed at a path that no longer exists.
      - name: Sourced-path existence gate
        run: bash tests/test-sourced-paths-exist.sh

      # A .env value that wraps onto a continuation line executes as shell when
      # the file is sourced. These scripts now extract the keys they need with
      # grep/cut instead. The fixture proves sourcing DOES fire a planted
      # marker, so the check cannot pass vacuously.
      - name: Env handling gate
        run: bash tests/security/test-env-handling.sh

      # A library whose documented entry point is `source` must not freeze the
      # names its callers already declared. `readonly RED=...` in such a library
      # is a hard error that kills the caller, and so is a plain assignment to a
      # name the caller froze, so the fix is a guard either way. The gate sources
      # the real libraries and also sources the checkpoint pair together, which
      # is the combination lib/checkpoint/SKILL.md prescribes and the only way
      # that particular collision is reachable.
      - name: Sourced-library safety gate
        run: bash tests/security/test-sourced-library-safety.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # dist/cli.cjs is a committed build artifact, because consuming projects
      # reach this skill through the ~/.claude/skills symlink with no
      # node_modules to build in. Placed after npm ci on purpose: the gate's
      # staleness check rebuilds from src/cli.ts and compares, and it SKIPS
      # rather than passes when esbuild is unresolvable.
      - name: Agent-selection bundle gate
        run: bash tests/test-agent-selection-bundle.sh

      - name: Run ESLint
        run: npm run lint 2>/dev/null || echo "Linting skipped - config not available"
        continue-on-error: true

      - name: Type checking
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [ '18', '20' ]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit -- --forceExit --maxWorkers=2
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/unit/coverage-final.json
          flags: unittest
          name: unit-${{ matrix.node-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Clean build
        run: npm run clean

      - name: Build distribution
        run: npm run build

      - name: Verify build outputs
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ dist directory not created"
            exit 1
          fi

          if [ ! -f "dist/src/index.js" ]; then
            echo "❌ dist/src/index.js not found"
            exit 1
          fi

          echo "✅ Build verification passed"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  macos:
    name: macOS Portability
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CFN uses associative arrays and mapfile, so bash 4+ is a hard
      # requirement. macOS ships bash 3.2 (2007) at /bin/bash and SIP prevents
      # replacing it, which is why every CFN script uses `#!/usr/bin/env bash`.
      - name: Install bash 5
        run: brew install bash

      # Deliberately NOT installing coreutils, gnu-sed or grep. Everything
      # below has to pass against the BSD userland macOS actually ships,
      # because that is what .claude/helpers/cfn-portable.sh exists to handle.
      # Installing the GNU tools here would make this job green without
      # testing anything.
      - name: Show the userland under test
        run: |
          echo "bash on PATH:  $(bash --version | head -1)"
          echo "/bin/bash:     $(/bin/bash --version | head -1)"
          echo "sed:           $(command -v sed)"
          echo "stat:          $(command -v stat)"
          echo "gtimeout:      $(command -v gtimeout || echo 'absent (perl fallback will be used)')"
          echo "coreutils:     $(brew list --formula 2>/dev/null | grep -c '^coreutils$') installed"

      - name: Require bash 4+ on PATH
        run: |
          MAJOR=$(bash -c 'echo "${BASH_VERSINFO[0]}"')
          echo "bash major version: $MAJOR"
          if [ "$MAJOR" -lt 4 ]; then
            echo "::error::bash $MAJOR is on PATH. CFN needs 4+; brew install bash did not take effect."
            exit 1
          fi

      - name: Shell portability gate
        run: bash tests/test-shell-portability.sh

      - name: Shell syntax gate
        run: bash tests/test-shell-syntax.sh

      # This is the job's real payload. On Linux the shim library defines
      # nothing, so its BSD translation paths are only ever executed here.
      - name: Portable shim unit tests
        run: bash tests/test-portable-shims.sh

      - name: Global config linker tests
        run: bash tests/test-link-global-config.sh

      - name: Runtime dir linker tests
        run: bash tests/test-link-runtime-dirs.sh

      - name: Portability skill-ref unit tests
        run: bash tests/test-portability-skill-refs.sh

      # Resolves every skill script's root-anchor chain by executing it and
      # requires the landing dir to hold package.json + .git. Catches the
      # wrong-../-depth family that 921604f4d and the later skill
      # consolidations left behind, plus per-project anchors that must follow
      # CLAUDE_PROJECT_DIR instead of the shared CFN checkout.
      - name: Root resolution gate
        run: bash tests/test-root-resolution.sh

      - name: PROJECT_ROOT resolution regressions
        run: bash tests/test-project-root-resolution.sh

      - name: Path containment gate
        run: bash tests/security/test-path-containment.sh

      # Executes each script's assignment-only prefix to resolve every
      # 'source' target naming .claude, then requires the file to exist. This is
      # the gate for the class the skill consolidation created: scripts moved
      # into lib/<area>/ and into .claude/cfn-extras/ without their referrers
      # being updated, so a source line pointed at a path that no longer exists.
      - name: Sourced-path existence gate
        run: bash tests/test-sourced-paths-exist.sh

      # A .env value that wraps onto a continuation line executes as shell when
      # the file is sourced. These scripts now extract the keys they need with
      # grep/cut instead. The fixture proves sourcing DOES fire a planted
      # marker, so the check cannot pass vacuously.
      - name: Env handling gate
        run: bash tests/security/test-env-handling.sh

      # A library whose documented entry point is `source` must not freeze the
      # names its callers already declared. `readonly RED=...` in such a library
      # is a hard error that kills the caller, and so is a plain assignment to a
      # name the caller froze, so the fix is a guard either way. The gate sources
      # the real libraries and also sources the checkpoint pair together, which
      # is the combination lib/checkpoint/SKILL.md prescribes and the only way
      # that particular collision is reachable.
      - name: Sourced-library safety gate
        run: bash tests/security/test-sourced-library-safety.sh

      # Guards against the shim library quietly becoming a no-op on macOS --
      # a broken capability probe would leave every test above passing against
      # the GNU-shaped assertions while real scripts still failed.
      - name: Assert shims are actually active on macOS
        run: |
          SHIMMED=$(bash -c '. .claude/helpers/cfn-portable.sh; type -t timeout stat date sed 2>/dev/null' | grep -c function || true)
          echo "shimmed commands: $SHIMMED of 4 (timeout stat date sed)"
          if [ "$SHIMMED" -eq 0 ]; then
            echo "::error::cfn-portable.sh defined no shims on macOS. A capability probe is wrong."
            exit 1
          fi

      # Every script that sources the shim library must be able to find it from
      # its own location. A wrong relative path is silent (the source line ends
      # in `|| true`), so it has to be checked rather than waited for.
      - name: Verify every shim source path resolves
        run: |
          FAILED=0
          while IFS= read -r f; do
            rel=$(sed -n 's|^\. "\$(cd "\$(dirname "\${BASH_SOURCE\[0\]}")/\(.*\)" && pwd -P)/\.claude/helpers/cfn-portable\.sh".*|\1|p' "$f" | head -1)
            [ -n "$rel" ] || continue
            if [ ! -r "$(cd "$(dirname "$f")/$rel" 2>/dev/null && pwd -P)/.claude/helpers/cfn-portable.sh" ]; then
              echo "::error file=$f::shim source path does not resolve (rel=$rel)"
              FAILED=$((FAILED + 1))
            fi
          done < <(grep -rl 'cfn-portable\.sh' --include='*.sh' . | grep -v '^\./\.git/')
          echo "unresolved: $FAILED"
          [ "$FAILED" -eq 0 ]


  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, build-verification, macos ]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Job Status Summary:"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Unit Tests: ${{ needs.unit-tests.result }}"
          echo "  Build Verification: ${{ needs.build-verification.result }}"
          echo "  macOS Portability: ${{ needs.macos.result }}"

          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.build-verification.result }}" == "failure" || \
                "${{ needs.macos.result }}" == "failure" ]]; then
            echo "❌ Quality gate failed"
            exit 1
          fi

          echo "✅ Quality gate passed"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [ quality-gate ]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # CI Pipeline Results

          ## Summary
          - **Workflow:** ${{ github.workflow }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Status:** ${{ needs.quality-gate.result == 'success' && '✅ PASSED' || '❌ FAILED' }}

          ## Job Results
          - Lint & Type Check: Completed
          - Unit Tests: Completed
          - Build Verification: Completed
          - macOS Portability: Completed

          EOF
