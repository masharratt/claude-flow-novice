name: Integration Standards Enforcement

# Enforce integration standards on all pull requests
# - Linting (ESLint with integration rules)
# - Test coverage (≥85%)
# - Integration tests
# - Documentation completeness
# - Security scanning
#
# Blocks merge if any check fails

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.eslintrc.integration.js'
  push:
    branches:
      - main
      - develop

jobs:
  # ============================================
  # LINTING - Integration Pattern Enforcement
  # ============================================
  lint:
    name: ESLint - Integration Standards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with integration rules
        run: |
          npx eslint . --ext .ts,.tsx \
            --config .eslintrc.integration.js \
            --format=stylish \
            --max-warnings=0
        continue-on-error: false

      - name: Generate lint report
        if: always()
        run: |
          npx eslint . --ext .ts,.tsx \
            --config .eslintrc.integration.js \
            --format=json \
            --output-file=lint-report.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lint-report
          path: lint-report.json

      - name: Comment PR with lint results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('lint-report.json', 'utf8'));

            const errors = report.reduce((sum, file) => sum + file.errorCount, 0);
            const warnings = report.reduce((sum, file) => sum + file.warningCount, 0);

            const comment = `## ❌ ESLint Failed

            **Errors:** ${errors}
            **Warnings:** ${warnings}

            Please fix linting issues before merging.

            Run \`npx eslint . --ext .ts,.tsx --fix\` to auto-fix some issues.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================
  # TEST COVERAGE - Minimum 85%
  # ============================================
  test-coverage:
    name: Test Coverage ≥85%
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          npm test -- --coverage --coverageReporters=json --coverageReporters=text

      - name: Check coverage threshold
        run: |
          node -e "
          const coverage = require('./coverage/coverage-summary.json');
          const total = coverage.total;

          const lines = total.lines.pct;
          const statements = total.statements.pct;
          const functions = total.functions.pct;
          const branches = total.branches.pct;

          console.log('Coverage Summary:');
          console.log('Lines:', lines + '%');
          console.log('Statements:', statements + '%');
          console.log('Functions:', functions + '%');
          console.log('Branches:', branches + '%');

          const threshold = 85;
          if (lines < threshold || statements < threshold || functions < threshold || branches < threshold) {
            console.error('❌ Coverage below threshold (' + threshold + '%)');
            process.exit(1);
          }

          console.log('✅ Coverage meets threshold');
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

      - name: Comment PR with coverage results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const total = coverage.total;

            const emoji = total.lines.pct >= 85 ? '✅' : '❌';

            const comment = `## ${emoji} Test Coverage

            | Metric | Coverage |
            |--------|----------|
            | Lines | ${total.lines.pct}% |
            | Statements | ${total.statements.pct}% |
            | Functions | ${total.functions.pct}% |
            | Branches | ${total.branches.pct}% |

            **Threshold:** 85%
            **Status:** ${total.lines.pct >= 85 ? 'PASS' : 'FAIL'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================
  # INTEGRATION TESTS - All Must Pass
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          npm run test:integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: test-results/

  # ============================================
  # DOCUMENTATION - Completeness Check
  # ============================================
  documentation:
    name: Documentation Completeness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JSDoc completeness
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const glob = require('glob');

          const files = glob.sync('src/**/*.ts', {
            ignore: ['**/*.test.ts', '**/*.spec.ts', '**/*.mock.ts']
          });

          let missing = 0;

          files.forEach(file => {
            const content = fs.readFileSync(file, 'utf8');
            const exportedFunctions = content.match(/^export (async )?function/gm) || [];
            const exportedClasses = content.match(/^export class/gm) || [];

            const jsdocComments = content.match(/\/\*\*[\s\S]*?\*\//g) || [];

            const totalExports = exportedFunctions.length + exportedClasses.length;
            const documented = jsdocComments.length;

            if (totalExports > documented) {
              console.log('Missing JSDoc:', file, '(' + (totalExports - documented) + ' exports)');
              missing += (totalExports - documented);
            }
          });

          if (missing > 0) {
            console.error('❌ Found', missing, 'undocumented exports');
            process.exit(1);
          }

          console.log('✅ All public APIs documented');
          "

      - name: Check error code documentation
        run: |
          # Verify error codes are documented
          grep -r "ErrorCode\." src/ | grep -v ".test.ts" | grep -v ".mock.ts" > used-error-codes.txt || true

          if [ -s used-error-codes.txt ]; then
            echo "✅ Error codes found in use"
          else
            echo "⚠️ No error codes found (may be acceptable for some PRs)"
          fi

  # ============================================
  # SECURITY SCAN - No Secrets or Vulnerabilities
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate
        continue-on-error: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Check for hardcoded credentials
        run: |
          # Check for common credential patterns
          if grep -r -E "(password|secret|api_key|token)\s*=\s*['\"]" src/ --include="*.ts" --include="*.tsx"; then
            echo "❌ Found hardcoded credentials"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"

  # ============================================
  # MIGRATION COMPLIANCE - Check New Code
  # ============================================
  migration-compliance:
    name: Migration Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Full history for git diff

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migration compliance check
        run: |
          # Check changed files for compliance
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | \
            grep -E '\.(ts|tsx)$' | \
            xargs -I {} node scripts/check-compliance.js {}

      - name: Comment PR with compliance results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const comment = `## ❌ Migration Compliance Check Failed

            Some files do not follow integration standards:
            - Direct database imports detected
            - Generic Error usage found
            - Missing schema validation

            Please review the migration guide and update your code.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================
  # FINAL STATUS - All Checks Must Pass
  # ============================================
  final-status:
    name: All Standards Enforced
    runs-on: ubuntu-latest
    needs: [lint, test-coverage, integration-tests, documentation, security, migration-compliance]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test-coverage.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.documentation.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.migration-compliance.result }}" != "success" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All standards checks passed"

      - name: Comment PR success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const comment = `## ✅ All Standards Checks Passed

            - ✅ Linting
            - ✅ Test Coverage ≥85%
            - ✅ Integration Tests
            - ✅ Documentation
            - ✅ Security Scan
            - ✅ Migration Compliance

            This PR is ready for manual review.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
