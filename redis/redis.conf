# Redis Configuration for CFN Stabilization

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
# Note: These values should be overridden via command-line arguments
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# Persistence (minimal for container environment)
save ""
stop-writes-on-bgsave-error no
rdbcompression no
rdbchecksum no

# Logging
loglevel notice
logfile ""

# Client Management
timeout 300
tcp-keepalive 60
tcp-backlog 511

# Performance
databases 16
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Security
disable-command-keys ""
disable-command-flush ""
disable-command-load ""

# Container Optimizations
supervised systemd
daemonize no
pidfile /var/run/redis.pid
dir /data