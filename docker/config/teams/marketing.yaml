# Marketing Team Configuration
# Purpose: Email campaigns, analytics, and marketing automation

team:
  id: marketing
  name: "Marketing Team"
  description: "Email campaigns, marketing analytics, and content distribution"

  workspace:
    path: /workspace/marketing
    disk_quota: 40GB

  resources:
    memory: 10GB
    cpu_cores: 3
    max_agents: 4

  allowed_skills:
    - email-campaigns
    - analytics
    - database-readonly
    - content-generation

  network:
    subnet_id: 6  # 172.18.6.0/24
    coordinator_ip: 172.18.0.16
