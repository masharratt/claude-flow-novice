# QA Team Configuration
# Purpose: Quality assurance, testing, and security scanning

team:
  id: qa
  name: "QA Team"
  description: "End-to-end testing, load testing, security scanning, and quality validation"

  workspace:
    path: /workspace/tests
    disk_quota: 50GB

  resources:
    memory: 10GB
    cpu_cores: 3
    max_agents: 4

  allowed_skills:
    - playwright
    - load-testing
    - database-readonly
    - security-scanning

  network:
    subnet_id: 4  # 172.18.4.0/24
    coordinator_ip: 172.18.0.14
