# Frontend Team Configuration
# Purpose: UI development, browser testing, and user experience

team:
  id: frontend
  name: "Frontend Team"
  description: "React/TypeScript development, Playwright testing, and UI/UX implementation"

  workspace:
    path: /workspace/frontend
    disk_quota: 50GB

  resources:
    memory: 12GB
    cpu_cores: 4
    max_agents: 5

  allowed_skills:
    - playwright
    - browser-devtools
    - database-readonly
    - react-development

  network:
    subnet_id: 1  # 172.18.1.0/24
    coordinator_ip: 172.18.0.11
