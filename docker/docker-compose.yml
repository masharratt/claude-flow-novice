version: '3.8'

services:
  # ==============================================================================
  # Socket Proxy (Phase 4: Security Hardening)
  # ==============================================================================
  # Purpose: Isolate Docker socket access and restrict dangerous operations
  # Reference: planning/trigger/CLI_TRIGGER_COLLISION_ANALYSIS.md - Phase 4
  #
  # Security Benefits:
  # - Coordinator cannot run privileged containers
  # - Coordinator cannot access host network
  # - Coordinator cannot mount arbitrary volumes
  # - All Docker API operations logged for audit trail
  #
  # Allowed Operations:
  # - GET /containers/json       (list containers)
  # - GET /containers/{id}/json  (inspect containers)
  # - POST /containers/create    (create containers - agent spawning)
  # - POST /containers/{id}/start (start containers)
  # - POST /containers/{id}/stop (stop containers)
  # - DELETE /containers/{id}    (remove containers)
  #
  # Blocked Operations:
  # - Privileged mode (PRIVILEGED=0)
  # - Host network mode (HOST=0)
  # - Dangerous volume mounts (VOLUMES=0)
  # - Socket exposure to spawned containers (SOCKETV2=0)
  # ==============================================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: cfn-socket-proxy
    privileged: true
    volumes:
      # Mount host Docker socket (proxy needs direct access)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Container management (required for agent spawning)
      CONTAINERS: '1'          # GET /containers/json (list)
      POST: '1'                # Allow POST (create, start)
      DELETE: '1'              # Allow DELETE (remove)

      # Dangerous operations - explicitly disabled
      PRIVILEGED: '0'          # Deny --privileged mode
      HOST: '0'                # Deny --net=host
      VOLUMES: '0'             # Deny volume mounts outside /workspace
      SOCKETV2: '0'            # Deny socket exposure to spawned containers

      # Auditing
      LOG: '1'                 # Enable logging for security audit trail
    networks:
      - mcp-network
    expose:
      - "2375"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/containers/json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cfn-redis:
    image: redis:7-alpine
    container_name: cfn-redis
    networks:
      mcp-network:
        aliases:
          - cfn-redis      # Original name (CLI agents use this)
          - redis          # Alias for Trigger.dev compatibility
    ports:
      - "127.0.0.1:6379:6379"  # Security: Bind to localhost only (prevents external network access)
    volumes:
      - redis-data:/data
      - ./docker/redis-health-check.sh:/usr/local/bin/redis-health-check.sh:ro
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      # SECURITY FIX CHE-001: Use external script that reads password from environment
      # Prevents credential exposure in plaintext healthcheck command
      test: ["CMD", "/usr/local/bin/redis-health-check.sh"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      # SECURITY: Password passed as environment variable (not visible in docker inspect command)
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Security: Least-privilege principle for Redis
    user: "999:999"  # Run as redis user (non-root)
    read_only: true  # Filesystem is read-only (prevents malware persistence)
    tmpfs:
      - /tmp:size=64M,mode=1777  # Temporary storage for Redis operations
    cap_drop:
      - ALL  # Drop all capabilities
    cap_add:
      - SETGID  # Required for user switching
      - SETUID  # Required for user switching
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation attacks

  cfn-coordinator:
    image: cfn-intelligent-coordinator:latest
    container_name: cfn-coordinator
    mem_limit: 2g
    depends_on:
      cfn-redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    networks:
      - mcp-network
    # Security: Capability restrictions and seccomp profile
    cap_drop:
      - ALL  # Drop all capabilities by default
    cap_add:
      - NET_BIND_SERVICE  # Required for network services
      - DAC_OVERRIDE  # Required for Docker socket operations
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation
      - seccomp=docker/seccomp/agent-lifecycle.json  # Restrict syscalls
    read_only: false  # Coordinator needs write access for agent spawning logs
    tmpfs:
      - /tmp:size=512M,mode=1777  # Temporary storage for coordinator operations
    volumes:
      # SECURITY FIX CHE-002 + PHASE 4 HARDENING: Docker socket access via proxy
      # REMOVED: Direct socket mount (replaced by socket-proxy service)
      # Previous: /var/run/docker.sock:/var/run/docker.sock:ro
      #
      # Phase 4 Security Enhancement:
      # - Docker API operations now validated by socket-proxy
      # - Privileged operations (--privileged, --net=host) blocked
      # - Dangerous volume mounts prevented
      # - All operations logged for audit trail
      #
      # Coordinator connects via: DOCKER_HOST=tcp://socket-proxy:2375
      #
      # See docker/DOCKER_ACCESS_CONTROL.md for:
      # - Permitted Docker operations (agent spawn/terminate only)
      # - Prohibited actions (host filesystem, privileged containers, etc.)
      # - Security enforcement (capabilities, seccomp, network isolation)
      # - Validation checklist and audit commands
      - ${WORKSPACE_PATH:-/workspace}:/workspace:rw
      - ${CFN_SUCCESS_CRITERIA_FILE:-/dev/null}:/etc/cfn/success-criteria.json:ro
    environment:
      # Task Configuration
      - CFN_TASK_ID=${CFN_TASK_ID:-}
      - CFN_TASK_DESCRIPTION=${CFN_TASK_DESCRIPTION:-}
      - CFN_ITERATION_LIMIT=${CFN_ITERATION_LIMIT:-10}

      # Redis Coordination (ENV-001: Standardized naming - use REDIS_PASSWORD)
      # Maps standard REDIS_PASSWORD to CFN-prefixed variables for internal use
      - CFN_REDIS_HOST=cfn-redis
      - CFN_REDIS_PORT=6379
      - CFN_REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # Test-Driven Gate Configuration
      - CFN_GATE_STRATEGY=${CFN_GATE_STRATEGY:-auto}
      - CFN_TEST_PASS_RATE_GATE=${CFN_TEST_PASS_RATE_GATE:-0.95}
      - CFN_TEST_PASS_RATE_CONSENSUS=${CFN_TEST_PASS_RATE_CONSENSUS:-0.95}
      - CFN_SUCCESS_CRITERIA=${CFN_SUCCESS_CRITERIA:-}

      # Memory and Resource Management
      - CFN_MEMORY_BUDGET=${CFN_MEMORY_BUDGET:-40g}
      - CFN_MAX_PARALLEL_AGENTS=${CFN_MAX_PARALLEL_AGENTS:-4}
      - CFN_AGENT_MEMORY_LIMIT=${CFN_AGENT_MEMORY_LIMIT:-1g}

      # Container Runtime - Phase 4: Socket Proxy Integration
      - DOCKER_HOST=tcp://socket-proxy:2375
      - CFN_NETWORK_NAME=mcp-network
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: cfn-br0
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"  # Inter-container communication required
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16  # Isolated subnet for CFN containers
          gateway: 172.28.0.1
    # Security: Network isolation
    internal: false  # Allows outbound internet (required for AI API calls)

volumes:
  redis-data:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/.docker-volumes/redis
      o: bind
