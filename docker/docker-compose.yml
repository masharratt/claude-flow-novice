version: '3.8'

services:
  cfn-redis:
    image: redis:7-alpine
    container_name: cfn-redis
    networks:
      - mcp-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  mcp-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
