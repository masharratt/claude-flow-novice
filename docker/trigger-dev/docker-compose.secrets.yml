# ==============================================================================
# Docker Secrets Configuration - Phase 1.2a Security Hardening
# ==============================================================================
#
# Purpose: Define and manage sensitive credentials using Docker secrets
#
# Features:
# - External secrets for file-based management (development)
# - Docker Swarm secrets support (production)
# - Vault integration pattern (documented, not implemented)
# - Secrets mounted at /run/secrets/ in containers
# - Automatic fallback to environment variables
#
# Usage:
#
# Development (external files):
#   docker-compose -f docker-compose.yml -f docker-compose.secrets.yml up
#   (requires .secrets/ directory with credential files)
#
# Production (Docker Swarm):
#   docker swarm init
#   printf "sk-ant-..." | docker secret create ANTHROPIC_API_KEY -
#   docker stack deploy -c docker-compose.secrets.yml trigger-dev
#
# Vault Integration (future):
#   VAULT_ADDR=https://vault.example.com
#   VAULT_TOKEN=<token>
#   Secrets auto-loaded from Vault during entrypoint
#
# ==============================================================================

version: '3.9'

secrets:
  # ===========================================================================
  # AI Provider API Keys
  # ===========================================================================

  ANTHROPIC_API_KEY:
    description: "Anthropic Claude API key (https://api.anthropic.com)"
    file: ./.secrets/ANTHROPIC_API_KEY
    external: false

  ZAI_API_KEY:
    description: "Z.ai API key (cost-optimized provider)"
    file: ./.secrets/ZAI_API_KEY
    external: false

  KIMI_API_KEY:
    description: "Kimi API key (mid-range quality provider)"
    file: ./.secrets/KIMI_API_KEY
    external: false

  GEMINI_API_KEY:
    description: "Google Gemini API key (via OpenRouter)"
    file: ./.secrets/GEMINI_API_KEY
    external: false

  XAI_API_KEY:
    description: "XAi (Grok) API key (Anthropic-compatible)"
    file: ./.secrets/XAI_API_KEY
    external: false

  OPENROUTER_API_KEY:
    description: "OpenRouter API key (access 400+ models)"
    file: ./.secrets/OPENROUTER_API_KEY
    external: false

  # ===========================================================================
  # Trigger.dev Integration Secrets
  # ===========================================================================

  TRIGGER_API_KEY:
    description: "Trigger.dev API key for job execution"
    file: ./.secrets/TRIGGER_API_KEY
    external: false

  # ===========================================================================
  # Database and Infrastructure Secrets
  # ===========================================================================

  POSTGRES_PASSWORD:
    description: "PostgreSQL database password"
    file: ./.secrets/POSTGRES_PASSWORD
    external: false

  REDIS_PASSWORD:
    description: "Redis authentication password (if AUTH required)"
    file: ./.secrets/REDIS_PASSWORD
    external: false

  # ===========================================================================
  # Encryption and TLS Secrets
  # ===========================================================================

  AGE_PRIVATE_KEY:
    description: "Age encryption private key (for encrypted credential storage)"
    file: ./.secrets/AGE_PRIVATE_KEY
    external: false

services:
  # ===========================================================================
  # Trigger Worker with Secrets Support
  # ===========================================================================

  trigger-worker:
    secrets:
      # Mount all provider API keys
      - ANTHROPIC_API_KEY
      - ZAI_API_KEY
      - KIMI_API_KEY
      - GEMINI_API_KEY
      - XAI_API_KEY
      - OPENROUTER_API_KEY
      - TRIGGER_API_KEY
      - POSTGRES_PASSWORD
      - REDIS_PASSWORD
      - AGE_PRIVATE_KEY

    # Secrets are mounted at /run/secrets/{SECRET_NAME} in the container
    # Environment variables can reference them:
    # LOAD_SECRETS_OR_ENV "ANTHROPIC_API_KEY"
    # (see entrypoint.sh for load_secrets_or_env() function)

  # ===========================================================================
  # Trigger Webapp with Secrets Support
  # ===========================================================================

  trigger-webapp:
    secrets:
      - TRIGGER_API_KEY
      - POSTGRES_PASSWORD

  # ===========================================================================
  # PostgreSQL with Database Credentials
  # ===========================================================================

  postgres:
    secrets:
      - POSTGRES_PASSWORD
    environment:
      # Secret file will override this value
      # POSTGRES_PASSWORD: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_USER: postgres
      POSTGRES_DB: trigger

  # ===========================================================================
  # Redis with Authentication
  # ===========================================================================

  redis:
    secrets:
      - REDIS_PASSWORD
    command:
      - "redis-server"
      - "--requirepass"
      - "/run/secrets/REDIS_PASSWORD"  # If AUTH required (optional)

networks:
  trigger-cfn-network:
    driver: bridge

# ==============================================================================
# Implementation Notes
# ==============================================================================
#
# 1. EXTERNAL SECRETS (Development)
#    - Requires .secrets/ directory with credential files
#    - One secret per file (no equals signs)
#    - Example:
#      echo "sk-ant-..." > .secrets/ANTHROPIC_API_KEY
#      chmod 600 .secrets/ANTHROPIC_API_KEY
#
# 2. DOCKER SWARM SECRETS (Production)
#    - Use 'external: true' to reference pre-created secrets:
#      ANTHROPIC_API_KEY:
#        external: true
#    - Create secrets via:
#      printf "sk-ant-..." | docker secret create ANTHROPIC_API_KEY -
#    - Automatically removed from memory after mount
#
# 3. VAULT INTEGRATION (Future)
#    - Entrypoint checks VAULT_ADDR for dynamic secret loading
#    - Pattern: `load_vault_secret "ANTHROPIC_API_KEY" "secret/data/ai-providers"`
#    - Vault authenticates via:
#      - Service account tokens (Kubernetes)
#      - JWT tokens (external auth)
#      - Approle (machine-to-machine)
#
# 4. SECRET PRECEDENCE (Entrypoint)
#    - /run/secrets/{SECRET_NAME} (mounted by Docker)
#    - Environment variable fallback
#    - Default value (if applicable)
#
# 5. SECURITY PROPERTIES
#    - Secrets never written to logs (filtered by entrypoint)
#    - Secrets removed from memory after use (automatic)
#    - No persistence on container filesystem
#    - Audit trail available via Docker events
#
# ==============================================================================
