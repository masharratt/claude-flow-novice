version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trigger-dev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trigger}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trigger-cfn-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trigger-dev-redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trigger-cfn-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: trigger-dev-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/minio_data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - trigger-cfn-network
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: trigger-dev-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-trigger}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - trigger-cfn-network
    restart: unless-stopped

  # ==============================================================================
  # Docker Socket Proxy - Phase 1.2a Security Hardening
  # ==============================================================================
  # Purpose: Restrict Docker socket access to only required operations
  # Reference: Requirement 2 (Docker Socket Isolation)
  #
  # How It Works:
  # 1. Socket proxy listens on http://socket-proxy:2375
  # 2. Worker connects via DOCKER_HOST=unix:///run/docker.sock (through proxy)
  # 3. All Docker API calls validated against allowed operations
  # 4. Dangerous operations (privileged, host network) blocked
  #
  # Allowed Operations:
  # - GET /containers/json       (list containers)
  # - GET /containers/{id}/json  (inspect containers)
  # - POST /containers/create    (create containers - agent spawning)
  # - POST /containers/{id}/start (start containers)
  # - POST /containers/{id}/stop (stop containers)
  # - DELETE /containers/{id}    (remove containers)
  #
  # Blocked Operations:
  # - Privileged mode (PRIVILEGED=0)
  # - Host network mode (HOST=0)
  # - Dangerous volume mounts (VOLUMES=0)
  # - Socket exposure to spawned containers (SOCKETV2=0)
  # ==============================================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.4.1
    container_name: trigger-dev-socket-proxy
    privileged: true
    volumes:
      # Mount host Docker socket (proxy needs direct access)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Container management (required for agent spawning)
      CONTAINERS: '1'          # GET /containers/json (list)
      POST: '1'                # Allow POST (create, start)
      DELETE: '1'              # Allow DELETE (remove)

      # Dangerous operations - explicitly disabled
      PRIVILEGED: '0'          # Deny --privileged mode
      HOST: '0'                # Deny --net=host
      VOLUMES: '0'             # Deny volume mounts outside /workspace
      SOCKETV2: '0'            # Deny socket exposure to spawned containers

      # Auditing
      LOG: '1'                 # Enable logging for security audit trail
    networks:
      - trigger-cfn-network
    expose:
      - "2375"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/containers/json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  trigger-webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:latest
    container_name: trigger-dev-webapp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}
      SESSION_SECRET: ${AUTH_SECRET}
      REDIS_URL: redis://redis:6379
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_URL: http://minio:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-trigger}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      API_DOMAIN: ${API_DOMAIN:-http://trigger-webapp:3000}
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:3040}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # Self-hosted configuration
      TRIGGER_TELEMETRY_DISABLED: ${TRIGGER_TELEMETRY_DISABLED:-false}
      TRIGGER_SELF_HOSTED: ${TRIGGER_SELF_HOSTED:-true}
      TRIGGER_FEATURES_REAL_TIME: ${TRIGGER_FEATURES_REAL_TIME:-true}
      TRIGGER_FEATURES_CATALOG: ${TRIGGER_FEATURES_CATALOG:-true}
      TRIGGER_FEATURES_WEBHOOKS: ${TRIGGER_FEATURES_WEBHOOKS:-true}
      TRIGGER_FEATURES_BATCHES: ${TRIGGER_FEATURES_BATCHES:-true}
      TRIGGER_FEATURES_SCHEDULED: ${TRIGGER_FEATURES_SCHEDULED:-true}
      TRIGGER_ORG_SLUG: ${TRIGGER_ORG_SLUG:-cfn}
      TRIGGER_PROJECT_SLUG: ${TRIGGER_PROJECT_SLUG:-cfn}
      TRIGGER_ORG_ID: ${TRIGGER_ORG_ID}
      TRIGGER_PROJECT_ID: ${TRIGGER_PROJECT_ID}
    ports:
      - "${WEBAPP_PORT:-3040}:3000"
    volumes:
      - webapp_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 302 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trigger-cfn-network
    restart: unless-stopped

  trigger-worker:
    build:
      context: ../..
      dockerfile: docker/trigger-dev/Dockerfile.worker
    image: trigger-dev-worker-cfn:latest
    container_name: trigger-dev-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      trigger-webapp:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY}
      TRIGGER_API_KEY: ${TRIGGER_SECRET_KEY}
      TRIGGER_API_URL: http://trigger-webapp:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trigger}
      SESSION_SECRET: ${AUTH_SECRET}
      REDIS_URL: redis://redis:6379
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_URL: http://minio:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-trigger}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      API_DOMAIN: ${API_DOMAIN:-http://trigger-webapp:3000}
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:3040}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      WORKER_ID: ${WORKER_ID:-trigger-worker-1}
      WORKER_MODE: true
      # Self-hosted configuration
      TRIGGER_TELEMETRY_DISABLED: ${TRIGGER_TELEMETRY_DISABLED:-false}
      TRIGGER_SELF_HOSTED: ${TRIGGER_SELF_HOSTED:-true}
      TRIGGER_FEATURES_REAL_TIME: ${TRIGGER_FEATURES_REAL_TIME:-true}
      TRIGGER_FEATURES_CATALOG: ${TRIGGER_FEATURES_CATALOG:-true}
      TRIGGER_FEATURES_WEBHOOKS: ${TRIGGER_FEATURES_WEBHOOKS:-true}
      TRIGGER_FEATURES_BATCHES: ${TRIGGER_FEATURES_BATCHES:-true}
      TRIGGER_FEATURES_SCHEDULED: ${TRIGGER_FEATURES_SCHEDULED:-true}
      TRIGGER_ORG_SLUG: ${TRIGGER_ORG_SLUG:-cfn}
      TRIGGER_PROJECT_SLUG: ${TRIGGER_PROJECT_SLUG:-cfn}
      TRIGGER_ORG_ID: ${TRIGGER_ORG_ID}
      TRIGGER_PROJECT_ID: ${TRIGGER_PROJECT_ID}
      # CFN Agent Execution
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CFN_WORKSPACE: /workspace
      CFN_DELIVERABLES_PATH: /tmp/trigger-dev-deliverables
      # AI Provider Configuration for CFN Loop Agent Spawning
      ZAI_API_KEY: ${ZAI_API_KEY}
      KIMI_API_KEY: ${KIMI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CFN_CUSTOM_ROUTING: ${CFN_CUSTOM_ROUTING:-true}
      CFN_DEFAULT_PROVIDER: ${CFN_DEFAULT_PROVIDER:-zai}
      # Phase 1.2a: Socket Proxy Access (Security Hardening - Requirement 2)
      # Worker connects to socket proxy instead of direct socket mount
      # This prevents escalation attacks through unrestricted socket exposure
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - /tmp/trigger-dev-deliverables:/tmp/trigger-dev-deliverables
      # Mount project root for agent file access
      - ../..:/workspace:rw
      # Mount .env for API keys
      - ../../.env:/workspace/.env:ro
      # NOTE: Socket mount removed - using socket proxy instead
      # Previously: /var/run/docker.sock:/var/run/docker.sock
      # Reason: Direct socket access is CRITICAL security risk
      # Solution: Socket proxy (tecnativa/docker-socket-proxy) validates all operations
    networks:
      - trigger-cfn-network
    restart: unless-stopped

networks:
  trigger-cfn-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
  webapp_data:
