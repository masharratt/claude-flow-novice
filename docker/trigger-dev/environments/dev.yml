version: '3.9'

services:
  postgres:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      POSTGRES_INITDB_ARGS: "-c log_statement=all -c log_min_duration_statement=0"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 2

  redis:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M
    command: redis-server --save "" --appendonly no
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 2

  minio:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 2

  clickhouse:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 2

  trigger-webapp:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DEBUG: "trigger:*"
      TRIGGER_TELEMETRY_DISABLED: 'true'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 2

  trigger-worker:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: any
        delay: 1s
        max_attempts: 5
        window: 10s
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DEBUG: "trigger:*,cfn:*"
      TRIGGER_TELEMETRY_DISABLED: 'true'
      CFN_DEVELOPMENT_MODE: 'true'
      CFN_AGENT_SPAWN_DELAY_MS: '100'

  socket-proxy:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.125'
          memory: 64M
    environment:
      AUTH: '0'
      DEBUG: '1'
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 2
