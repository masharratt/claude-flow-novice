# Prometheus Alert Rules for MDAP + RuVector Production Monitoring
#
# Alert rules define conditions for critical infrastructure events.
# Integrates with Alertmanager for notification routing.
#
# Categories:
# - High error rate (>10%)
# - SLA breaches
# - RuVector connectivity issues
# - Tier 3 escalation spike
# - Resource exhaustion (disk, memory)

groups:
  - name: cfn_loop_production
    interval: 30s
    rules:
      # High Error Rate Alert
      # Triggers when error rate exceeds 10% over 5 minutes
      - alert: HighErrorRate
        expr: cfn_error_rate > 10
        for: 5m
        labels:
          severity: critical
          component: cfn-loop
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }}% for more than 5 minutes"
          dashboard: "http://localhost:3000/d/cfn-overview"
          runbook: "docs/RUNBOOK_HIGH_ERROR_RATE.md"

      # SLA Breach Alert
      # Triggers when any SLA breach occurs
      - alert: SLABreach
        expr: cfn_sla_breaches_total > 0
        for: 1m
        labels:
          severity: warning
          component: sla-enforcement
        annotations:
          summary: "SLA breach detected"
          description: "{{ $value | humanize }} SLA breaches recorded"
          runbook: "docs/RUNBOOK_SLA_BREACH.md"

      # SLA Breach Rate Elevated
      # Triggers when breach rate exceeds 5 per 1000 tasks
      - alert: SLABreachRateElevated
        expr: cfn_sla_breach_rate > 5
        for: 10m
        labels:
          severity: warning
          component: sla-enforcement
        annotations:
          summary: "Elevated SLA breach rate"
          description: "SLA breach rate is {{ $value | humanize }} per 1000 tasks"
          runbook: "docs/RUNBOOK_SLA_BREACH_RATE.md"

      # RuVector Down
      # Triggers when RuVector connectivity check fails
      - alert: RuVectorDown
        expr: ruvector_health_status == 0
        for: 2m
        labels:
          severity: critical
          component: ruvector
        annotations:
          summary: "RuVector service unavailable"
          description: "RuVector has been unreachable for more than 2 minutes"
          runbook: "docs/RUNBOOK_RUVECTOR_DOWN.md"

      # RuVector High Latency
      # Triggers when average latency exceeds 2000ms
      - alert: RuVectorHighLatency
        expr: cfn_ruvector_latency_avg_ms > 2000
        for: 5m
        labels:
          severity: warning
          component: ruvector
        annotations:
          summary: "RuVector high latency detected"
          description: "Average RuVector query latency is {{ $value | humanize }}ms"
          dashboard: "http://localhost:3000/d/ruvector-performance"
          runbook: "docs/RUNBOOK_RUVECTOR_LATENCY.md"

      # RuVector Cache Miss Rate High
      # Triggers when cache hit rate is below 30%
      - alert: RuVectorLowCacheHitRate
        expr: cfn_ruvector_cache_hit_rate < 0.3
        for: 10m
        labels:
          severity: warning
          component: ruvector
        annotations:
          summary: "RuVector cache hit rate low"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (expected >30%)"
          runbook: "docs/RUNBOOK_RUVECTOR_CACHE.md"

      # Tier 3 Escalation Spike
      # Triggers when Tier 3 escalations exceed 10 in 5 minutes
      - alert: Tier3EscalationSpike
        expr: |
          rate(cfn_tier_escalations_total{tier="3"}[5m]) * 300 > 10
        for: 5m
        labels:
          severity: warning
          component: decomposition-coordinator
        annotations:
          summary: "Tier 3 escalation spike detected"
          description: "{{ $value | humanize }} Tier 3 escalations in the last 5 minutes"
          dashboard: "http://localhost:3000/d/tier-escalations"
          runbook: "docs/RUNBOOK_TIER3_ESCALATION.md"

      # Gate Check Failure Rate High
      # Triggers when gate check failure rate exceeds 20%
      - alert: GateCheckFailureRate
        expr: (1 - cfn_gate_check_pass_rate) > 0.2
        for: 10m
        labels:
          severity: warning
          component: gate-check
        annotations:
          summary: "Gate check failure rate elevated"
          description: "Gate check failure rate is {{ $value | humanizePercentage }} (expected <20%)"
          runbook: "docs/RUNBOOK_GATE_CHECK_FAILURE.md"

      # Task Completion Rate Low
      # Triggers when completion rate falls below 90%
      - alert: LowTaskCompletionRate
        expr: cfn_task_completion_rate < 0.9
        for: 15m
        labels:
          severity: warning
          component: task-executor
        annotations:
          summary: "Low task completion rate"
          description: "Task completion rate is {{ $value | humanizePercentage }} (expected >90%)"
          runbook: "docs/RUNBOOK_LOW_COMPLETION_RATE.md"

      # Disk Space Critical
      # Triggers when disk usage exceeds 90%
      - alert: DiskSpaceCritical
        expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.1
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Disk space critical"
          description: "Disk usage is {{ $value | humanizePercentage }} (>90%)"
          runbook: "docs/RUNBOOK_DISK_SPACE.md"

      # Memory Usage High
      # Triggers when heap memory usage exceeds 85%
      - alert: MemoryUsageHigh
        expr: process_resident_memory_bytes / (process_virtual_memory_max_bytes or on() vector(1048576000)) > 0.85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Memory usage high"
          description: "Memory usage is {{ $value | humanizePercentage }} (>85%)"
          runbook: "docs/RUNBOOK_MEMORY_HIGH.md"

      # Database Connection Pool Exhausted
      # Triggers when available connections fall below 10%
      - alert: DBConnectionPoolExhausted
        expr: db_connection_pool_available_connections / db_connection_pool_size < 0.1
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool exhausted"
          description: "Available connections is {{ $value | humanizePercentage }} of pool"
          runbook: "docs/RUNBOOK_DB_CONNECTIONS.md"

      # Request Latency High (p95)
      # Triggers when p95 request latency exceeds 5 seconds
      - alert: RequestLatencyHigh
        expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 5
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Request latency high"
          description: "P95 request latency is {{ $value | humanize }}s (expected <5s)"
          dashboard: "http://localhost:3000/d/api-performance"
          runbook: "docs/RUNBOOK_API_LATENCY.md"

      # Service Down
      # Triggers when service has been unreachable for 2 minutes
      - alert: ServiceDown
        expr: up{job="cfn-loop-service"} == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been down for more than 2 minutes"
          runbook: "docs/RUNBOOK_SERVICE_DOWN.md"

      # API Key Expiration Warning
      # Triggers 7 days before API key expiration
      - alert: APIKeyExpirationWarning
        expr: (api_key_expiration_timestamp - time()) / 86400 < 7
        for: 1h
        labels:
          severity: warning
          component: security
        annotations:
          summary: "API key expiration warning"
          description: "API key {{ $labels.key_id }} expires in {{ $value | humanize }} days"
          runbook: "docs/RUNBOOK_API_KEY_EXPIRATION.md"

      # RuVector Query Timeout
      # Triggers when query timeout rate exceeds 5%
      - alert: RuVectorQueryTimeout
        expr: |
          (
            rate(cfn_ruvector_queries_timeout[5m]) /
            rate(cfn_ruvector_queries_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: ruvector
        annotations:
          summary: "RuVector query timeout rate high"
          description: "Query timeout rate is {{ $value | humanizePercentage }} (expected <5%)"
          runbook: "docs/RUNBOOK_RUVECTOR_TIMEOUT.md"

# Alert routing configuration (for Alertmanager integration)
# This should be in a separate alertmanager.yml file
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093  # Alertmanager default port

