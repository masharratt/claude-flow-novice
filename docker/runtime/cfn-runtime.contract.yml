---
# CFN Runtime Environment Variable Contract
# Defines the single source of truth for all CFN infrastructure environment variables
# Used across agents, coordinators, and orchestrators

version: "1.0"
last_updated: "2025-11-13"

# Redis Configuration
redis:
  CFN_REDIS_HOST:
    description: "Redis server hostname"
    default: "cfn-redis"
    type: "string"
    scope: ["agent", "coordinator", "orchestrator", "mcp-server"]
    legacy_aliases: ["REDIS_HOST", "MCP_REDIS_HOST"]
    required: false
    example: "cfn-redis"

  CFN_REDIS_PORT:
    description: "Redis server port"
    default: "6379"
    type: "integer"
    scope: ["agent", "coordinator", "orchestrator", "mcp-server"]
    legacy_aliases: ["REDIS_PORT", "MCP_REDIS_PORT"]
    required: false
    example: "6379"

  CFN_REDIS_URL:
    description: "Complete Redis connection URL (overrides host:port)"
    default: null
    type: "string"
    scope: ["agent", "coordinator", "orchestrator", "mcp-server"]
    legacy_aliases: ["REDIS_URL", "MCP_REDIS_URL"]
    required: false
    example: "redis://cfn-redis:6379"

  CFN_REDIS_PASSWORD:
    description: "Redis authentication password - STRONGLY RECOMMENDED in production"
    default: null
    type: "string"
    scope: ["agent", "coordinator", "orchestrator", "mcp-server"]
    legacy_aliases: ["REDIS_PASSWORD", "MCP_REDIS_PASSWORD"]
    required_in_production: true
    required: false
    example: "your-secure-redis-password-here"
    security_notes: |
      SECURITY CRITICAL: Redis is exposed without authentication if password not set.
      In production environments, CFN_REDIS_PASSWORD MUST be set to a strong password.
      Use 'requirepass' directive in Redis server configuration to enforce authentication.
      Minimum recommended length: 32 characters with mixed case, numbers, and symbols.

# Agent Configuration
agent:
  CFN_AGENT_ID:
    description: "Unique identifier for the agent instance"
    default: "auto-generated"
    type: "string"
    scope: ["agent"]
    legacy_aliases: ["AGENT_ID"]
    required: false
    example: "docker-1763027157-22103"

  CFN_AGENT_TYPE:
    description: "Type/role of the agent"
    default: "unknown"
    type: "string"
    scope: ["agent"]
    legacy_aliases: ["AGENT_TYPE"]
    required: false
    example: "coder"

  CFN_AGENT_IMAGE:
    description: "Docker image URI for agent containers"
    default: "claude-flow-novice-agent:latest"
    type: "string"
    scope: ["coordinator"]
    legacy_aliases: ["AGENT_IMAGE"]
    required: false
    example: "claude-flow-novice-agent:2.15.0"

  CFN_AGENT_REGISTRY:
    description: "Container registry for agent images"
    default: "docker.io"
    type: "string"
    scope: ["coordinator"]
    legacy_aliases: ["AGENT_REGISTRY"]
    required: false
    example: "gcr.io"

# Task Configuration
task:
  CFN_TASK_ID:
    description: "Unique identifier for the current task/swarm"
    default: "auto-generated"
    type: "string"
    scope: ["agent", "coordinator", "orchestrator"]
    legacy_aliases: ["TASK_ID", "SWARM_ID"]
    required: false
    example: "cfn-task-12345"

  CFN_TASK_DESCRIPTION:
    description: "Human-readable task description"
    default: null
    type: "string"
    scope: ["coordinator", "orchestrator"]
    legacy_aliases: ["TASK_DESCRIPTION"]
    required: true
    example: "Fix TypeScript errors in frontend codebase"

  CFN_TASK_TIMEOUT:
    description: "Maximum execution time for task in seconds"
    default: "3600"
    type: "integer"
    scope: ["agent", "coordinator", "orchestrator"]
    required: false
    example: "1800"

  CFN_ITERATION_LIMIT:
    description: "Maximum number of iterations in CFN Loop"
    default: "10"
    type: "integer"
    scope: ["coordinator", "orchestrator"]
    legacy_aliases: ["MAX_ITERATIONS"]
    required: false
    example: "5"

# Coordinator Configuration
coordinator:
  CFN_MEMORY_BUDGET:
    description: "Memory allocation for coordinator container"
    default: "40g"
    type: "string"
    scope: ["coordinator"]
    legacy_aliases: ["MEMORY_BUDGET"]
    required: false
    example: "8g"

  CFN_CPU_LIMIT:
    description: "CPU allocation for coordinator container"
    default: "4"
    type: "string"
    scope: ["coordinator"]
    required: false
    example: "2.5"

  CFN_MAX_PARALLEL_AGENTS:
    description: "Maximum number of agents to spawn simultaneously"
    default: "4"
    type: "integer"
    scope: ["coordinator"]
    required: false
    example: "8"

  CFN_SPAWN_INTERVAL_MS:
    description: "Delay between agent spawns in milliseconds"
    default: "500"
    type: "integer"
    scope: ["coordinator"]
    required: false
    example: "1000"

  CFN_AGENTS_LIST:
    description: "Comma-separated list of agent types to spawn"
    default: null
    type: "string"
    scope: ["coordinator", "orchestrator"]
    legacy_aliases: ["AGENTS"]
    required: false
    example: "coder,reviewer,tester"

  CFN_AGENT_MEMORY_LIMIT:
    description: "Memory limit for individual agent containers"
    default: "1g"
    type: "string"
    scope: ["coordinator"]
    legacy_aliases: ["MEMORY_LIMIT"]
    required: false
    example: "2g"

# Orchestrator Configuration
orchestrator:
  CFN_ORCHESTRATOR_MODE:
    description: "Orchestration mode for CFN Loop"
    default: "standard"
    type: "string"
    scope: ["orchestrator"]
    required: false
    example: "standard"

  CFN_GATE_CONFIDENCE_THRESHOLD:
    description: "Minimum confidence score to pass CFN Loop gate"
    default: "0.75"
    type: "float"
    scope: ["orchestrator"]
    legacy_aliases: ["GATE_THRESHOLD", "GATE_CONFIDENCE_THRESHOLD"]
    required: false
    example: "0.85"

  CFN_CONSENSUS_THRESHOLD:
    description: "Minimum consensus score for validator agreement"
    default: "0.90"
    type: "float"
    scope: ["orchestrator"]
    legacy_aliases: ["CONSENSUS_THRESHOLD"]
    required: false
    example: "0.80"

# API Configuration
api:
  CFN_API_HOST:
    description: "Host for CFN coordination API"
    default: "0.0.0.0"
    type: "string"
    scope: ["coordinator", "orchestrator"]
    required: false
    example: "127.0.0.1"

  CFN_API_PORT:
    description: "Port for CFN coordination API"
    default: "9000"
    type: "integer"
    scope: ["coordinator", "orchestrator"]
    required: false
    example: "8080"

  CFN_API_KEY:
    description: "API authentication key"
    default: "auto-generated"
    type: "string"
    scope: ["coordinator", "agent"]
    required: false

# Provider Configuration
providers:
  CFN_CUSTOM_ROUTING:
    description: "Enable custom AI provider routing"
    default: "false"
    type: "boolean"
    scope: ["agent", "coordinator"]
    required: false
    example: "true"

  CFN_DEFAULT_PROVIDER:
    description: "Default AI provider for agents"
    default: "zai"
    type: "string"
    scope: ["agent", "coordinator"]
    required: false
    example: "zai"

# Logging Configuration
logging:
  CFN_LOG_LEVEL:
    description: "Global logging level"
    default: "info"
    type: "string"
    scope: ["agent", "coordinator", "orchestrator"]
    required: false
    example: "debug"

  CFN_LOG_FORMAT:
    description: "Log output format"
    default: "json"
    type: "string"
    scope: ["agent", "coordinator", "orchestrator"]
    required: false
    example: "text"

# Container Runtime Configuration
container:
  CFN_CONTAINER_MODE:
    description: "Whether running in containerized environment"
    default: "false"
    type: "boolean"
    scope: ["agent", "coordinator", "orchestrator"]
    required: false

  CFN_DOCKER_SOCKET:
    description: "Path to Docker socket for container spawning"
    default: "/var/run/docker.sock"
    type: "string"
    scope: ["coordinator"]
    required: false
    example: "/var/run/docker.sock"

  CFN_NETWORK_NAME:
    description: "Docker network name for agent containers"
    default: "cfn-network"
    type: "string"
    scope: ["coordinator"]
    legacy_aliases: ["NETWORK"]
    required: false
    example: "cfn-prod"

# Feature Flags
features:
  CFN_ENABLE_PROGRESS_TRACKING:
    description: "Enable detailed progress tracking"
    default: "true"
    type: "boolean"
    scope: ["agent", "coordinator"]
    required: false

  CFN_ENABLE_HEALTH_CHECKS:
    description: "Enable container health checks"
    default: "true"
    type: "boolean"
    scope: ["coordinator"]
    required: false

  CFN_ENABLE_METRICS:
    description: "Enable metrics collection"
    default: "true"
    type: "boolean"
    scope: ["agent", "coordinator", "orchestrator"]
    required: false

# Environment Variable Precedence
# Applied in order (first set wins):
# 1. Explicitly passed environment variables
# 2. CFN_ prefixed variables (standard)
# 3. Legacy variables (with warnings)
# 4. Defaults specified in this contract
# 5. Hard-coded defaults in code
