version: '3.8'

# Centralized Logging Stack - Loki + Promtail + Grafana
# Task P2-2.3: Centralized Logging with ELK/Loki Stack
#
# This docker-compose file provides a complete centralized logging solution:
# - Loki: Log aggregation and storage (lightweight alternative to Elasticsearch)
# - Promtail: Log shipper agent that collects logs from containers and files
# - Grafana: Visualization and dashboarding for logs with Loki datasource
# - MinIO: S3-compatible object storage for Loki chunk storage (optional, for production)
#
# Features:
# - 30-day log retention with automatic cleanup
# - Structured JSON log format
# - Correlation ID propagation and search
# - Full-text log search
# - Real-time log streaming
# - Log statistics and metrics
#
# Usage:
#   docker-compose -f docker-compose.logging.yml up -d    # Start logging stack
#   docker-compose -f docker-compose.logging.yml logs -f   # View logs
#   docker-compose -f docker-compose.logging.yml down -v   # Stop and cleanup

services:
  # Loki - Log aggregation server
  loki:
    image: grafana/loki:2.9.0
    container_name: cfn-loki
    restart: unless-stopped
    networks:
      - mcp-network
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yml
      - loki-data:/loki
    environment:
      - LOKI_CONFIG_PATH=/etc/loki/local-config.yml
    command: -config.file=/etc/loki/local-config.yml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/loki/api/v1/status/buildinfo"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.example.description=Loki log aggregation"
      - "com.example.version=2.9.0"

  # Promtail - Log shipper agent
  promtail:
    image: grafana/promtail:2.9.0
    container_name: cfn-promtail
    restart: unless-stopped
    networks:
      - mcp-network
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOKI_URL=http://loki:3100
      - LOG_LEVEL=info
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.example.description=Promtail log shipper"
      - "com.example.version=2.9.0"

  # Grafana - Visualization and dashboarding
  grafana:
    image: grafana/grafana:10.2.0
    container_name: cfn-grafana
    restart: unless-stopped
    networks:
      - mcp-network
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_DISABLE_SIGNED_UI_PLUGINS=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_LOG_LEVEL=info
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.example.description=Grafana dashboards and visualization"
      - "com.example.version=10.2.0"

  # Optional: MinIO for S3-compatible object storage (for production Loki)
  # Uncomment these lines for production deployment
  # minio:
  #   image: minio/minio:latest
  #   container_name: cfn-minio
  #   restart: unless-stopped
  #   networks:
  #     - mcp-network
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/minio_data
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   command: server /minio_data --console-address ":9001"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 30s
  #     timeout: 20s
  #     retries: 3

networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  # minio-data:
  #   driver: local

# Quick start guide:
#
# 1. Start the stack:
#    docker-compose -f docker-compose.logging.yml up -d
#
# 2. Access services:
#    - Loki API: http://localhost:3100
#    - Grafana: http://localhost:3000 (admin/admin)
#    - Promtail metrics: http://localhost:9080
#
# 3. Configure Grafana datasource:
#    - URL: http://loki:3100
#    - Add to Loki datasource
#
# 4. Create dashboards:
#    - Import monitoring/grafana/dashboards/logging-overview.json
#    - Query logs with LogQL
#
# 5. Query logs:
#    curl 'http://localhost:3100/loki/api/v1/query_range?query={job="varlogs"}'
#
# 6. Monitor logs in real-time:
#    - Use Grafana Explore with Loki datasource
#    - Filter by level, service, correlation ID
#
# 7. Stop the stack:
#    docker-compose -f docker-compose.logging.yml down -v
