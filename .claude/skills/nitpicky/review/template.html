<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Nitpicky Review</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #1a1d21;
    --text-dim: #5c6470;
    --line: #d9dde3;
    --accent: #2456d6;
    --accent-soft: #e3eafc;
    --fix: #1a7f37;
    --fix-soft: #ddf3e4;
    --defer: #9a6700;
    --defer-soft: #fff0c2;
    --deny: #b3261e;
    --deny-soft: #fde7e5;
    --high: #b3261e;
    --medium: #9a6700;
    --low: #57606a;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --surface: #1d2026;
      --surface-2: #262a31;
      --text: #e8eaed;
      --text-dim: #9aa3af;
      --line: #363c45;
      --accent: #7d9ef7;
      --accent-soft: #24304d;
      --fix: #4ec06a;
      --fix-soft: #1d3527;
      --defer: #d9a52a;
      --defer-soft: #3a3016;
      --deny: #ef6b61;
      --deny-soft: #3c211f;
      --high: #ef6b61;
      --medium: #d9a52a;
      --low: #9aa3af;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 16px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 12px 0 10px;
  }
  .head-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; }
  .app-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .head-actions { display: flex; align-items: center; gap: 10px; }
  #save-status { color: var(--text-dim); font-size: 12px; min-width: 140px; text-align: right; }
  #save-status.err { color: var(--deny); font-weight: 600; }
  #save-status.ok { color: var(--fix); }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  #btn-retry { border-color: var(--deny); color: var(--deny); }
  .progress-wrap { max-width: 960px; margin: 10px auto 4px; }
  .progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  #progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #progress-text { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    max-width: 960px; margin: 10px auto 0;
  }
  .chip {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em;
    border-radius: 999px; padding: 2px 9px; background: var(--surface-2); color: var(--text-dim);
  }
  #lens-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .lens-toggle { cursor: pointer; border: 1px solid transparent; user-select: none; }
  .lens-toggle.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .filters select, .filters input {
    font: inherit; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px;
  }
  .filters input { min-width: 160px; flex: 1; max-width: 260px; }
  main { max-width: 960px; margin: 16px auto 60px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .card[data-decided="fix"] { border-left: 4px solid var(--fix); }
  .card[data-decided="defer"] { border-left: 4px solid var(--defer); }
  .card[data-decided="deny"] { border-left: 4px solid var(--deny); }
  .card.flash { outline: 2px solid var(--accent); }
  .card-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .fid { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-dim); }
  .chip.sev-high { background: var(--deny-soft); color: var(--high); }
  .chip.sev-medium { background: var(--defer-soft); color: var(--medium); }
  .chip.sev-low { background: var(--surface-2); color: var(--low); }
  .chip.lens { background: var(--accent-soft); color: var(--accent); }
  .what { margin: 0 0 6px; font-weight: 600; }
  .expected { margin: 0 0 8px; }
  .expected b { color: var(--fix); }
  .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; word-break: break-all; }
  .meta a { color: var(--accent); }
  figure { margin: 0 0 12px; }
  figure img {
    max-width: 100%; max-height: 320px; border: 1px solid var(--line);
    border-radius: 6px; cursor: zoom-in; display: block;
  }
  .proof-missing {
    border: 1px dashed var(--line); border-radius: 6px; color: var(--text-dim);
    padding: 18px; text-align: center; font-size: 12px;
  }
  .decide { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 16px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active[data-d="fix"] { background: var(--fix); color: #fff; }
  .seg button.active[data-d="defer"] { background: var(--defer); color: #fff; }
  .seg button.active[data-d="deny"] { background: var(--deny); color: #fff; }
  .dec-state { color: var(--text-dim); font-size: 12px; }
  textarea {
    width: 100%; min-height: 54px; resize: vertical;
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  textarea:focus, select:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 50;
    display: flex; align-items: center; justify-content: center; cursor: zoom-out; padding: 24px;
  }
  #lightbox[hidden], #export-modal[hidden] { display: none; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #export-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    max-width: 860px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px;
  }
  .modal-box h2 { margin: 0 0 6px; font-size: 16px; }
  .modal-hint { color: var(--text-dim); font-size: 12px; margin: 0 0 12px; }
  #export-path { color: var(--fix); font-weight: 600; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  #export-text { width: 100%; min-height: 300px; font-family: ui-monospace, monospace; font-size: 12px; }
  #storage-warn {
    background: var(--defer-soft); color: var(--defer); border: 1px solid var(--defer);
    border-radius: 8px; padding: 8px 12px; margin: 10px auto 0; max-width: 960px; font-size: 13px;
  }
  .empty-note { color: var(--text-dim); text-align: center; padding: 40px 0; }
  @media (max-width: 560px) {
    .filters input { max-width: none; }
    .seg button { padding: 8px 14px; }
  }
</style>
</head>
<body>
<div id="storage-warn" hidden></div>
<header>
  <div class="head-row">
    <div>
      <h1>Nitpicky Review</h1>
      <div class="app-meta" id="app-meta"></div>
    </div>
    <div class="head-actions">
      <span id="save-status" role="status" aria-live="polite"></span>
      <button id="btn-retry" hidden>Retry save</button>
      <button id="btn-export" class="primary">Export checklist</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress"><div id="progress-bar"></div></div>
    <div id="progress-text"></div>
  </div>
  <div class="filters">
    <div id="lens-chips" aria-label="Filter by lens"></div>
    <select id="f-severity" aria-label="Filter by severity">
      <option value="any">Any severity</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <select id="f-status" aria-label="Filter by decision">
      <option value="any">Any status</option>
      <option value="undecided">Undecided</option>
      <option value="fix">Fix</option>
      <option value="defer">Defer</option>
      <option value="deny">Deny</option>
    </select>
    <input id="f-search" type="search" placeholder="Search findings..." aria-label="Search findings">
    <button id="btn-next">Next undecided</button>
  </div>
</header>
<main id="cards"></main>
<div id="lightbox" hidden><img id="lightbox-img" alt="Enlarged screenshot"></div>
<div id="export-modal" hidden>
  <div class="modal-box">
    <h2>Export</h2>
    <p class="modal-hint" id="export-path" hidden></p>
    <p class="modal-hint" id="export-hint"></p>
    <div class="modal-actions">
      <button id="btn-dl-checklist" class="primary">Download CHECKLIST.md</button>
      <button id="btn-dl-decisions">Download decisions backup</button>
      <button id="btn-copy">Copy checklist</button>
      <button id="btn-close-export">Close</button>
    </div>
    <textarea id="export-text" readonly spellcheck="false"></textarea>
  </div>
</div>

<script type="application/json" id="nitpicky-payload">__NITPICKY_PAYLOAD__</script>
<script>
(function () {
  "use strict";
  var payload = JSON.parse(document.getElementById("nitpicky-payload").textContent);
  var findings = payload.findings.slice();
  var SEV_ORDER = { high: 0, medium: 1, low: 2 };
  var DECISIONS = ["fix", "defer", "deny"];
  var SERVER_MODE = location.protocol === "http:" || location.protocol === "https:";
  var DECISIONS_KEY = "nitpicky:" + payload.run_id;          // file:// mode store
  var DRAFTS_KEY = "nitpicky-drafts:" + payload.run_id;      // server mode unacked queue

  // id -> {decision, explanation} — the merged view driving the UI
  var decisions = {};
  var drafts = {};       // server mode: unacknowledged patches
  var inflight = {};     // id -> ts of the POST currently in flight
  var saveFailed = false;
  var lastError = null;
  var everSaved = false;
  var chain = Promise.resolve();

  function storageGet(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || "null") || fallback; }
    catch (e) { storageBlocked(); return fallback; }
  }
  function storageSet(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { storageBlocked(); return false; }
  }
  var storageWarned = false;
  function storageBlocked() {
    if (storageWarned) return;
    storageWarned = true;
    var el = document.getElementById("storage-warn");
    el.hidden = false;
    el.textContent = "Browser storage is blocked for this page. " +
      (SERVER_MODE ? "Draft recovery during a save outage is unavailable."
                   : "Decisions last only for this session; export before closing.");
  }

  // ---------- status ----------
  function updateStatus() {
    var el = document.getElementById("save-status");
    var retry = document.getElementById("btn-retry");
    if (!SERVER_MODE) { el.textContent = ""; retry.hidden = true; return; }
    if (saveFailed) {
      el.textContent = "Not saved" + (lastError ? " (" + lastError + ")" : "");
      el.className = "err";
      retry.hidden = false;
    } else if (Object.keys(inflight).length) {
      el.textContent = "Saving...";
      el.className = "";
      retry.hidden = true;
    } else if (Object.keys(drafts).length) {
      el.textContent = "Queued...";
      el.className = "";
      retry.hidden = true;
    } else if (everSaved) {
      el.textContent = "All changes saved " + new Date().toLocaleTimeString();
      el.className = "ok";
      retry.hidden = true;
    } else {
      el.textContent = SERVER_MODE ? "Server mode: decisions write to disk" : "";
      el.className = "";
      retry.hidden = true;
    }
  }

  document.getElementById("btn-retry").addEventListener("click", function () {
    saveFailed = false; lastError = null; updateStatus();
    Object.keys(drafts).forEach(function (id) { enqueuePost(id, drafts[id]); });
  });

  // ---------- persistence ----------
  function persistStorageMode() {
    storageSet(DECISIONS_KEY, decisions);
    var el = document.getElementById("save-status");
    el.textContent = "Saved " + new Date().toLocaleTimeString();
    el.className = "ok";
  }

  function enqueuePost(id, entry) {
    chain = chain.then(function () { return postOne(id, entry); });
  }

  function postOne(id, entry) {
    inflight[id] = entry.ts;
    updateStatus();
    return fetch("/api/decision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: id,
        decision: entry.decision || null,
        explanation: entry.explanation || "",
        clientTs: entry.ts
      })
    }).then(function (res) {
      return res.json().then(function (j) { return { ok: res.ok, j: j }; });
    }).then(function (r) {
      delete inflight[id];
      if (r.ok) {
        everSaved = true;
        // remove only the exact acknowledged patch; a newer local edit keeps its place
        if (drafts[id] && drafts[id].ts === entry.ts) {
          delete drafts[id];
          storageSet(DRAFTS_KEY, drafts);
        }
      } else {
        saveFailed = true;
        lastError = r.j && r.j.error ? r.j.error : "save failed";
      }
      updateStatus();
    }).catch(function (err) {
      delete inflight[id];
      saveFailed = true;
      lastError = err && err.message ? err.message : "server unreachable";
      updateStatus();
    });
  }

  function applyEdit(id, fields, immediate) {
    decisions[id] = decisions[id] || {};
    if ("decision" in fields) decisions[id].decision = fields.decision;
    if ("explanation" in fields) decisions[id].explanation = fields.explanation;

    var card = document.querySelector('.card[data-id="' + id + '"]');
    if (card) { paintDecision(card, id); }
    updateProgress(); applyFilters();

    if (!SERVER_MODE) { persistStorageMode(); return; }
    var entry = {
      decision: decisions[id].decision || null,
      explanation: decisions[id].explanation || "",
      ts: new Date().toISOString()
    };
    drafts[id] = entry;
    storageSet(DRAFTS_KEY, drafts);
    if (immediate) enqueuePost(id, entry);
    else updateStatus(); // debounced edits enqueue on flush
  }

  // debounced text: enqueue after quiet period; clicks/blur flush now
  var textTimers = {};
  function editDecision(id, decision) {
    applyEdit(id, { decision: decisions[id] && decisions[id].decision === decision ? null : decision }, true);
  }
  function editText(id, value, flush) {
    clearTimeout(textTimers[id]);
    if (flush) {
      delete textTimers[id];
      applyEdit(id, { explanation: value }, true);
    } else {
      textTimers[id] = setTimeout(function () { applyEdit(id, { explanation: value }, true); }, 400);
      if (SERVER_MODE) updateStatus();
    }
  }

  window.addEventListener("beforeunload", function (e) {
    if (SERVER_MODE && (Object.keys(drafts).length || Object.keys(inflight).length)) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  // ---------- init state ----------
  function seedFromServer(data) {
    var serverById = data.decisions || {};
    Object.keys(serverById).forEach(function (id) {
      var rec = serverById[id] || {};
      if (rec.decision || rec.explanation) {
        decisions[id] = { decision: rec.decision || null, explanation: rec.explanation || "" };
      }
    });
    drafts = storageGet(DRAFTS_KEY, {});
    Object.keys(drafts).forEach(function (id) {
      var d = drafts[id];
      var rec = serverById[id];
      if (!rec || !rec.updatedAt || (d.ts && Date.parse(d.ts) > Date.parse(rec.updatedAt))) {
        decisions[id] = { decision: d.decision || null, explanation: d.explanation || "" };
        enqueuePost(id, d);
      } else {
        delete drafts[id]; // server already has newer — drop stale draft
        storageSet(DRAFTS_KEY, drafts);
      }
    });
  }

  var cards = [];

  function buildCard(f) {
    var card = document.createElement("article");
    card.className = "card";
    card.dataset.id = f.id;

    var head = document.createElement("div");
    head.className = "card-head";
    function chip(cls, text) {
      var s = document.createElement("span");
      s.className = "chip " + cls; s.textContent = text;
      head.appendChild(s);
    }
    var fid = document.createElement("span");
    fid.className = "fid"; fid.textContent = f.id;
    head.appendChild(fid);
    chip("lens", f.lens);
    chip("sev-" + f.severity, f.severity);
    if (f.area) chip("", f.area);
    card.appendChild(head);

    var what = document.createElement("p");
    what.className = "what"; what.textContent = f.what;
    card.appendChild(what);

    var exp = document.createElement("p");
    exp.className = "expected";
    var b = document.createElement("b"); b.textContent = "Expected: ";
    exp.appendChild(b);
    exp.appendChild(document.createTextNode(f.expected));
    card.appendChild(exp);

    var meta = document.createElement("div");
    meta.className = "meta";
    var a = document.createElement("a");
    a.href = f.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = f.url;
    meta.appendChild(document.createTextNode("Where: "));
    meta.appendChild(a);
    if (f.steps) meta.appendChild(document.createTextNode(" · Steps: " + f.steps));
    card.appendChild(meta);

    var fig = document.createElement("figure");
    if (f.proof_ok) {
      var img = document.createElement("img");
      img.src = f.screenshot;
      img.alt = "Screenshot: " + f.what;
      img.loading = "lazy";
      img.addEventListener("click", function () {
        document.getElementById("lightbox-img").src = f.screenshot;
        document.getElementById("lightbox").hidden = false;
      });
      fig.appendChild(img);
    } else {
      var miss = document.createElement("div");
      miss.className = "proof-missing";
      miss.textContent = "Screenshot missing: " + f.screenshot +
        " (not found next to this page; re-shoot and re-merge)";
      fig.appendChild(miss);
    }
    card.appendChild(fig);

    var decide = document.createElement("div");
    decide.className = "decide";
    var seg = document.createElement("div");
    seg.className = "seg";
    DECISIONS.forEach(function (d) {
      var btn = document.createElement("button");
      btn.textContent = d.charAt(0).toUpperCase() + d.slice(1);
      btn.dataset.d = d;
      btn.addEventListener("click", function () { editDecision(f.id, d); });
      seg.appendChild(btn);
    });
    decide.appendChild(seg);
    var state = document.createElement("span");
    state.className = "dec-state";
    decide.appendChild(state);
    card.appendChild(decide);

    var ta = document.createElement("textarea");
    ta.placeholder = "Context for the implementation team: why fix it, why deny it, what to watch for when deferring...";
    ta.addEventListener("input", function () { editText(f.id, ta.value, false); });
    ta.addEventListener("blur", function () { editText(f.id, ta.value, true); });
    card.appendChild(ta);

    return card;
  }

  function paintDecision(card, id) {
    var d = (decisions[id] && decisions[id].decision) || "";
    card.dataset.decided = d || "none";
    card.querySelectorAll(".seg button").forEach(function (btn) {
      btn.classList.toggle("active", btn.dataset.d === d);
    });
    card.querySelector(".dec-state").textContent = d ? d : "undecided";
    var ta = card.querySelector("textarea");
    var expl = (decisions[id] && decisions[id].explanation) || "";
    if (expl && ta.value !== expl) ta.value = expl;
  }

  function updateProgress() {
    var decided = findings.filter(function (f) {
      return decisions[f.id] && DECISIONS.indexOf(decisions[f.id].decision) !== -1;
    }).length;
    var pct = findings.length ? Math.round((decided / findings.length) * 100) : 0;
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-text").textContent =
      decided + " of " + findings.length + " decided (" + pct + "%)";
  }

  // ---------- filters ----------
  var filters = { lenses: {}, severity: "any", status: "any", q: "" };
  findings.forEach(function (f) { filters.lenses[f.lens] = true; });

  function matches(f) {
    if (!filters.lenses[f.lens]) return false;
    if (filters.severity !== "any" && f.severity !== filters.severity) return false;
    var d = decisions[f.id] && decisions[f.id].decision;
    if (filters.status !== "any") {
      if (filters.status === "undecided" && d) return false;
      if (filters.status !== "undecided" && d !== filters.status) return false;
    }
    if (filters.q) {
      var expl = decisions[f.id] && decisions[f.id].explanation ? decisions[f.id].explanation : "";
      var hay = (f.id + " " + f.lens + " " + f.what + " " + f.expected + " " + f.area + " " + expl).toLowerCase();
      if (hay.indexOf(filters.q) === -1) return false;
    }
    return true;
  }

  function applyFilters() {
    var visible = 0;
    findings.forEach(function (f, i) {
      var show = matches(f);
      cards[i].hidden = !show;
      if (show) visible++;
    });
    var note = document.getElementById("empty-note");
    if (note) note.hidden = visible !== 0;
  }

  var chipsEl = document.getElementById("lens-chips");
  Object.keys(filters.lenses).sort().forEach(function (lens) {
    var chip = document.createElement("span");
    chip.className = "chip lens-toggle on";
    chip.textContent = lens;
    chip.setAttribute("role", "button");
    chip.tabIndex = 0;
    function toggle() {
      filters.lenses[lens] = !filters.lenses[lens];
      chip.classList.toggle("on", filters.lenses[lens]);
      applyFilters();
    }
    chip.addEventListener("click", toggle);
    chip.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
    chipsEl.appendChild(chip);
  });

  document.getElementById("f-severity").addEventListener("change", function (e) {
    filters.severity = e.target.value; applyFilters();
  });
  document.getElementById("f-status").addEventListener("change", function (e) {
    filters.status = e.target.value; applyFilters();
  });
  var searchTimer;
  document.getElementById("f-search").addEventListener("input", function (e) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      filters.q = e.target.value.trim().toLowerCase(); applyFilters();
    }, 200);
  });
  document.getElementById("btn-next").addEventListener("click", function () {
    for (var i = 0; i < findings.length; i++) {
      var d = decisions[findings[i].id] && decisions[findings[i].id].decision;
      if (!d && !cards[i].hidden) {
        cards[i].scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
    }
    updateStatus();
    document.getElementById("save-status").textContent = "No undecided visible";
  });

  // ---------- export ----------
  function itemBlock(f, expl, checkbox) {
    var lines = [];
    lines.push((checkbox ? "- [ ] " : "- ") + f.id + " [" + f.lens + " · " + f.severity + "] " + f.what);
    lines.push("  - Where: " + f.url);
    lines.push("  - Expected: " + f.expected);
    var proof = f.proof_ok ? f.screenshot : f.screenshot + " (screenshot missing)";
    lines.push("  - Proof: " + proof);
    if (f.steps) lines.push("  - Steps: " + f.steps);
    if (expl) lines.push('  - Context from review: "' + expl + '"');
    return lines;
  }

  function buildChecklist() {
    var groups = { fix: [], defer: [], deny: [] };
    var undecided = 0;
    findings.forEach(function (f) {
      var d = decisions[f.id] || {};
      if (DECISIONS.indexOf(d.decision) !== -1) {
        groups[d.decision].push([f, d.explanation || ""]);
      } else {
        undecided++;
      }
    });
    Object.keys(groups).forEach(function (k) {
      groups[k].sort(function (x, y) {
        return (SEV_ORDER[x[0].severity] || 9) - (SEV_ORDER[y[0].severity] || 9);
      });
    });
    var total = findings.length;
    var lines = [
      "# Nitpicky — Pre-Launch Polish Checklist",
      "",
      "App: " + payload.app_url,
      "Run: " + payload.run_id,
      "Generated: " + new Date().toISOString(),
      "Progress: decided " + (total - undecided) + " of " + total + " — "
        + "Fix: " + groups.fix.length + " · Defer: " + groups.defer.length
        + " · Deny: " + groups.deny.length + " · Undecided: " + undecided + " (excluded below)",
      ""
    ];
    if (groups.fix.length) {
      lines.push("## Fix (" + groups.fix.length + ") — hand to implementation team", "");
      groups.fix.forEach(function (it) { lines = lines.concat(itemBlock(it[0], it[1], true), ""); });
    }
    if (groups.defer.length) {
      lines.push("## Deferred (" + groups.defer.length + ") — revisit after launch", "");
      groups.defer.forEach(function (it) { lines = lines.concat(itemBlock(it[0], it[1], false), ""); });
    }
    if (groups.deny.length) {
      lines.push("## Denied (" + groups.deny.length + ") — reviewed, no action (appendix)", "");
      groups.deny.forEach(function (it) {
        var reason = it[1] ? ' — "' + it[1] + '"' : "";
        lines.push("- " + it[0].id + " [" + it[0].lens + " · " + it[0].severity + "] " + it[0].what + reason);
      });
      lines.push("");
    }
    return lines.join("\n").replace(/\n+$/, "\n");
  }

  function buildDecisionsBackup() {
    var out = {};
    findings.forEach(function (f) {
      var d = decisions[f.id] || {};
      if (d.decision || d.explanation) {
        out[f.id] = { decision: d.decision || null, explanation: d.explanation || "" };
      }
    });
    return JSON.stringify({ run_id: payload.run_id, app_url: payload.app_url, decisions: out }, null, 2);
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: type || "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  var exportModal = document.getElementById("export-modal");
  document.getElementById("btn-export").addEventListener("click", function () {
    document.getElementById("export-text").value = buildChecklist();
    var path = document.getElementById("export-path");
    var hint = document.getElementById("export-hint");
    if (SERVER_MODE) {
      path.hidden = false;
      path.textContent = "Writing CHECKLIST.md to the run directory...";
      hint.textContent = "";
      fetch("/api/export", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.ok) {
          path.textContent = "Written to disk: " + j.path +
            " (Fix " + j.counts.fix + " · Defer " + j.counts.defer +
            " · Deny " + j.counts.deny + " · undecided " + j.undecided + ")";
        } else {
          path.hidden = true;
          hint.textContent = "Export to disk failed: " + (j.error || "unknown");
        }
      }).catch(function (err) {
        path.hidden = true;
        hint.textContent = "Export to disk failed (" + err.message + "); use the download button instead.";
      });
    } else {
      path.hidden = true;
      hint.textContent = "File mode: downloads land in your browser's Downloads folder. " +
        "Move CHECKLIST.md into the run directory to keep it with the evidence.";
    }
    exportModal.hidden = false;
  });
  document.getElementById("btn-close-export").addEventListener("click", function () {
    exportModal.hidden = true;
  });
  exportModal.addEventListener("click", function (e) {
    if (e.target === exportModal) exportModal.hidden = true;
  });
  document.getElementById("btn-dl-checklist").addEventListener("click", function () {
    download("CHECKLIST.md", buildChecklist(), "text/markdown");
  });
  document.getElementById("btn-dl-decisions").addEventListener("click", function () {
    download("decisions-backup.json", buildDecisionsBackup(), "application/json");
  });
  document.getElementById("btn-copy").addEventListener("click", function () {
    var text = buildChecklist();
    var btn = this;
    function done(okFlag) {
      btn.textContent = okFlag ? "Copied" : "Copy failed, select manually";
      setTimeout(function () { btn.textContent = "Copy checklist"; }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.getElementById("export-text");
      ta.removeAttribute("readonly");
      ta.select();
      var okFlag = document.execCommand && document.execCommand("copy");
      ta.setAttribute("readonly", "");
      done(okFlag);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      exportModal.hidden = true;
      document.getElementById("lightbox").hidden = true;
    }
  });

  document.getElementById("lightbox").addEventListener("click", function () {
    this.hidden = true;
  });

  // ---------- boot ----------
  var main = document.getElementById("cards");
  findings.sort(function (a, b) {
    return (SEV_ORDER[a.severity] - SEV_ORDER[b.severity])
      || a.lens.localeCompare(b.lens) || a.id.localeCompare(b.id);
  });
  findings.forEach(function (f) {
    var card = buildCard(f);
    main.appendChild(card);
    cards.push(card);
    paintDecision(card, f.id);
  });
  if (!findings.length) {
    main.appendChild(document.createTextNode("No findings in this run."));
  }
  var emptyNote = document.createElement("div");
  emptyNote.id = "empty-note";
  emptyNote.className = "empty-note";
  emptyNote.hidden = true;
  emptyNote.textContent = "No findings match the current filters.";
  main.appendChild(emptyNote);

  document.getElementById("app-meta").textContent =
    payload.app_url + " · run " + payload.run_id + " · " + findings.length + " findings" +
    (SERVER_MODE ? " · server mode" : " · file mode");

  if (SERVER_MODE) {
    fetch("/api/decisions").then(function (r) {
      if (!r.ok) throw new Error("server responded " + r.status);
      return r.json();
    }).then(function (data) {
      seedFromServer(data);
      findings.forEach(function (f, i) { paintDecision(cards[i], f.id); });
      updateProgress(); applyFilters(); updateStatus();
    }).catch(function (err) {
      var el = document.getElementById("storage-warn");
      el.hidden = false;
      el.textContent = "Save server unreachable (" + err.message + "). " +
        "Do NOT refresh: your next clicks are kept locally and can be retried once the server is back.";
      saveFailed = true;
      lastError = "server unreachable";
      updateStatus();
    });
  } else {
    decisions = storageGet(DECISIONS_KEY, {});
    findings.forEach(function (f, i) { paintDecision(cards[i], f.id); });
    updateProgress(); applyFilters(); updateStatus();
  }

  // deep link: #NP-xxxxxx scrolls to and flashes that finding
  if (location.hash) {
    var target = document.querySelector('.card[data-id="' + location.hash.slice(1) + '"]');
    if (target) {
      target.scrollIntoView({ block: "center" });
      target.classList.add("flash");
      setTimeout(function () { target.classList.remove("flash"); }, 1600);
    }
  }
})();
</script>
</body>
</html>
