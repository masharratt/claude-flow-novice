# Work mode guard rules. Read by .claude/hooks/cfn-work-mode-guard.sh on every Bash call
# while work mode is on.
#
# Format, one rule per line, fields separated by " ;; ":
#   action ;; scope ;; regex ;; message
#   action   block | allow
#   scope    *  (every project) or a project name: the folder that holds the repo's .git
#            (worktrees resolve to their main repo, so MDTWII worktrees count as MDTWII)
#   regex    POSIX extended regex (bash =~; no \b or \s, use [[:space:]]). It is matched
#            against each simple command in the Bash call, after splitting on ; & | ( ) ` and
#            newlines outside quotes, and after stripping leading VAR=value assignments and
#            wrappers (env, nohup, exec, time, timeout N, command, then, do, else). Anchor
#            with ^ so a rule matches the program being run, not a word inside its arguments.
#   message  what was refused and the allowed alternative (shown to the agent)
#
# First matching rule wins, per simple command. No match = allowed. Project rules sit
# above generic ones so a project can carve out exceptions.

# ---------- MDTWII ----------
block ;; MDTWII ;; ^(bash |sh )?[^ ]*tools/unity/run\.sh .*(BuildCapture|CampaignCapture|CampaignPlayerBuild|CaptureOpenScene|BuildPlayer) ;; Unity captures, player builds and render jobs need the screen. Allowed instead: non-render jobs as tools/unity/run.sh --nographics <Class.Method>, and EditMode tests as tools/unity/run.sh --nographics --test EditMode.
allow ;; MDTWII ;; ^(bash |sh )?[^ ]*tools/unity/run\.sh --nographics( |$) ;; headless Unity run
block ;; MDTWII ;; ^(bash |sh )?[^ ]*tools/unity/run\.sh( |$) ;; Unity without --nographics can open a window. Allowed instead: tools/unity/run.sh --nographics <Class.Method>, or tools/unity/run.sh --nographics --test EditMode.
block ;; MDTWII ;; ^[^ ]*Builds/[^ ]*\.app/Contents/MacOS/ ;; Running a player build opens a game window. Allowed instead: EditMode tests via tools/unity/run.sh --nographics --test EditMode, or headless Rust runs (cargo test, m2-battle-run).

# ---------- every project ----------
block ;; * ;; ^(/usr/bin/)?open( |$) ;; open launches an app, file or URL in a visible window. Allowed instead: read the file or fetch the URL from the terminal (cat, curl, WebFetch); save screenshots to a path and leave them for the user.
block ;; * ;; ^(/usr/bin/)?osascript( |$) ;; osascript drives GUI apps on screen. Allowed instead: shell commands that do not touch the GUI.
block ;; * ;; ^(/usr/bin/)?qlmanage( |$) ;; qlmanage shows a Quick Look window. Allowed instead: inspect the file from the terminal.
allow ;; * ;; ^[^ ]*/Unity\.app/Contents/MacOS/Unity( .*)? -batchmode( .*)? -nographics( |$) ;; headless Unity
allow ;; * ;; ^[^ ]*/Unity\.app/Contents/MacOS/Unity( .*)? -nographics( .*)? -batchmode( |$) ;; headless Unity
block ;; * ;; ^[^ ]*\.app/Contents/MacOS/ ;; Running an app bundle binary opens a window. Allowed instead: a headless or command-line mode of the tool (Unity: -batchmode -nographics).
allow ;; * ;; ^([^ ]*/)?blender( .*)? (-b|--background)( |$) ;; headless Blender
block ;; * ;; ^([^ ]*/)?blender( |$) ;; Blender without -b opens its window. Allowed instead: blender -b (or --background) ... --python script.py.
block ;; * ;; (^|[ /])playwright .*--(headed|ui|debug)( |$) ;; A headed Playwright run opens a browser window. Allowed instead: the same run without --headed/--ui/--debug (headless is the default).
