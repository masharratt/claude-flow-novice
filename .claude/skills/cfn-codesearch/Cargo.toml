[package]
name = "codesearch"
version = "0.2.0"
edition = "2021"

[dependencies]
# Database - SQLite for metadata (entities, refs, fast SQL queries)
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
# Database - PostgreSQL/pgvector for embeddings (fast vector search)
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.12" }
# pgvector type support for postgres
pgvector = { version = "0.4", features = ["postgres"] }
# Vector operations
ndarray = { version = "0.15", features = ["rayon"], default-features = false }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CLI
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
# File system
walkdir = "2.4"
# Hashing
sha2 = "0.10"
# Async (for embedding API)
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# Parallel processing
rayon = "1.8"
# Memory mapping
memmap2 = "0.9"
# Binary serialization
byteorder = "1.5"
# Regular expressions
regex = "1.10"
# Date/time
chrono = { version = "0.4", features = ["serde"] }
# File operations
fs_extra = "1.3"
# Environment
dotenvy = "0.15"
# Qdrant vector database
qdrant-client = { version = "1.10", default-features = false, features = ["serde"] }
uuid = { version = "1.0", features = ["v5"] }
# Memgraph graph database (bolt protocol)
neo4rs = "0.8"
# Local embeddings (no API key needed)
fastembed = "4"
# Tree-sitter for AST parsing
# Tree-sitter for AST parsing

# Tree-sitter for AST parsing
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-typescript = "0.20"

[dev-dependencies]
tempfile = "3.23.0"
