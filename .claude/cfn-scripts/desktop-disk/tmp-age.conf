# /tmp age cleanup, 30d -> 7d. Overrides /usr/lib/tmpfiles.d/tmp.conf (same file name wins).
# Why: 28 GB of art cache sat in /tmp for up to 30 days on the main disk (2026-11 growth audit).
# Install (needs sudo): sudo install -m 0644 tmp-age.conf /etc/tmpfiles.d/tmp.conf
#   then: sudo systemd-tmpfiles --clean   (WSL: needs systemd=true, which this box has)
D /tmp 1777 root root 7d
# Cargo target dirs under /tmp keep their own (already tight) rule; also in cargo-target-cleanup.conf.
d /tmp/*-target 0755 root root 7d -
