groups:
- name: workflow_codification
  interval: 30s
  rules:
  - alert: HealthScoreDrop
    expr: |
      (
        workflow_codification_health_score
        - workflow_codification_health_score offset 24h
      ) < -10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Health score dropped >10 points"
      description: "Skill {{ $labels.skill_name }} health score dropped significantly. Review skill implementation and test coverage."

  - alert: CircuitBreakerOpen
    expr: workflow_codification_circuit_breaker_state == 2
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Circuit breaker open - skill failure isolation active"
      description: "Skill {{ $labels.skill_name }} circuit breaker is OPEN. Consecutive failures detected. Immediate investigation required."

  - alert: RegressionTestFailureRate
    expr: workflow_codification_regression_test_pass_rate < 0.95
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Regression test pass rate below 95%"
      description: "Skill {{ $labels.skill_name }} test pass rate is {{ $value | humanizePercentage }}. New test failures detected."

  - alert: HighCompositeErrorRate
    expr: |
      sum(rate(workflow_codification_composite_executions_total{status="failed"}[5m]))
      /
      sum(rate(workflow_codification_composite_executions_total[5m]))
      > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High composite execution error rate"
      description: "Composite skill error rate is {{ $value | humanizePercentage }}. Threshold: 5%. Review skill composition and dependencies."

  - alert: PatternRecommendationAcceptanceDropped
    expr: workflow_codification_pattern_recommendation_acceptance_rate < 0.5
    for: 10m
    labels:
      severity: info
    annotations:
      summary: "Pattern recommendation acceptance rate dropped"
      description: "Acceptance rate for {{ $labels.strength_level }} recommendations is {{ $value | humanizePercentage }}. Review recommendation quality."

  - alert: CompositeExecutionTimeout
    expr: histogram_quantile(0.95, workflow_codification_composite_execution_duration_seconds) > 300
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Composite execution P95 duration exceeds 5 minutes"
      description: "95th percentile execution time for {{ $labels.composite_name }} is {{ $value }}s. Performance degradation detected."
