version: '3.8'

# Multi-Worktree Support:
# This compose file uses environment variables for ports and project names.
# Use scripts/docker/run-in-worktree.sh to run in different worktrees simultaneously.
#
# Direct usage (single worktree):
#   docker-compose up -d
#
# Multi-worktree usage (recommended):
#   ./scripts/docker/run-in-worktree.sh up -d

services:
  # Redis for agent coordination
  redis:
    image: redis:7-alpine
    # container_name removed for multi-worktree support (auto-generated as ${COMPOSE_PROJECT_NAME}_redis_1)
    restart: unless-stopped
    networks:
      - mcp-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "${CFN_REDIS_PORT:-6379}:6379"

  # Playwright for browser automation
  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    # container_name removed for multi-worktree support
    restart: unless-stopped
    networks:
      - mcp-network
    environment:
      - NODE_ENV=production
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for data persistence (optional)
  postgres:
    image: postgres:15-alpine
    # container_name removed for multi-worktree support
    restart: unless-stopped
    networks:
      - mcp-network
    environment:
      POSTGRES_DB: cfn_loop
      POSTGRES_USER: cfn_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfn_dev_password_change_in_production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfn_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${CFN_POSTGRES_PORT:-5432}:5432"

networks:
  mcp-network:
    driver: bridge
    # Network name will be auto-prefixed with COMPOSE_PROJECT_NAME
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  # Volume names will be auto-prefixed with COMPOSE_PROJECT_NAME
  redis-data:
    driver: local
  postgres-data:
    driver: local

# Example usage:
#
# Single worktree (traditional):
#   docker-compose up -d
#   docker-compose ps
#   docker-compose logs -f redis
#   docker-compose down
#   docker-compose down -v
#
# Multi-worktree (isolated):
#   ./scripts/docker/run-in-worktree.sh up -d
#   ./scripts/docker/run-in-worktree.sh ps
#   ./scripts/docker/run-in-worktree.sh logs -f redis
#   ./scripts/docker/run-in-worktree.sh down
#   ./scripts/docker/run-in-worktree.sh down -v
#
# Check configuration:
#   ./scripts/docker/run-in-worktree.sh --dry-run --verbose up