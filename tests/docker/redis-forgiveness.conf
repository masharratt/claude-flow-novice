# Redis Configuration for CFN Loop Forgiveness Testing
# Optimized for high availability and failure simulation

# Network Configuration
port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Memory Management
maxmemory 128mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
save 900 1
save 300 10
save 60 10000

# AOF Configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
logfile ""
syslog-enabled yes
syslog-ident redis-forgiveness

# Client Configuration
maxclients 10000

# Memory Usage Optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Replication (for future expansion)
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5

# Security
requirepass ""
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_b835c3f8a6d2e1f4"

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitor
latency-monitor-threshold 100

# Event Notification (for debugging)
notify-keyspace-events "Ex"

# Memory Allocator
# Using jemalloc if available
# This can help with memory fragmentation

# Advanced Settings
# These settings help with failure testing scenarios
rdb-save-incremental-fsync yes
rdbcompression yes
stop-writes-on-bgsave-error yes
dynamic-hz yes
rdb-del-sync-files no

# Testing-specific Settings
# These settings are optimized for forgiveness testing

# Reduce persistence overhead for faster testing
save ""
save 60 100

# Increase memory limits for testing scenarios
maxmemory-policy volatile-lru

# Enable better monitoring
latency-monitor-threshold 50

# Increase client buffer limits for coordination testing
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Timeout settings for failure simulation
timeout 60
tcp-keepalive 30

# Connection backlog for coordination testing
tcp-backlog 1024

# Enable lazy expiration for better performance during testing
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no

# Disable AOF rewrite during testing to reduce I/O
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 200
auto-aof-rewrite-min-size 32mb

# Enable monitoring for debugging
monitor-latency yes

# Enable command statistics for testing analysis
command-stats no

# Set replica priority for potential failover testing
replica-priority 100
replica-announce-ip ""
replica-announce-port 6379

# Enable cluster mode for future distributed testing
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000

# Memory defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# Client query buffer limits
client-query-buffer-limit 1gb

# Proto max bulk len
proto-max-bulk-len 512mb

# Frequency of serverCron tasks
hz 10

# Enable memory debugging for testing
# Uncomment for detailed memory analysis
# MEMWATCH 1