  - id: risk-thin-content-v1
    type: algorithm
    category: risk-scores
    name: "Thin Content Risk Assessment"
    description: |
      Content with <300 words, low information density, or minimal unique
      value carries high risk of algorithmic devaluation or manual action.
    confidence: 0.91
    lifecycle: promoted
    version: "2.1.0"
    createdAt: "2024-06-01T08:00:00Z"
    updatedAt: "2025-01-18T10:00:00Z"
    evidence:
      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-06-15T10:00:00Z"
        metrics:
          riskScore: 0.88
          deindexationRate: 0.72
        notes: "Site with 500+ thin pages experienced 72% deindexation after core update"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-07-20T14:30:00Z"
        metrics:
          riskScore: 0.85
          rankingDropRate: 0.65
        notes: "Pages <300 words dropped avg 8.5 positions post-Helpful Content Update"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-08-12T11:15:00Z"
        metrics:
          riskScore: 0.90
          manualActionRate: 0.15
        notes: "15% of sites with thin content received manual actions"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-09-25T09:45:00Z"
        metrics:
          riskScore: 0.87
          organicTrafficLoss: 0.58
        notes: "Average 58% organic traffic loss for thin content sites"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-10-30T13:00:00Z"
        metrics:
          riskScore: 0.89
          recoveryDifficulty: 0.82
        notes: "Recovery from thin content penalty takes avg 6-9 months"

    metadata:
      applicability:
        contentTypes: ["all"]
        industries: ["all"]
      performance:
        successRate: 1.0
        totalApplications: 5
        avgImpact:
          riskScore: 0.878
          avgPenaltySeverity: 0.644
      keywords: ["thin content", "helpful content", "content quality", "risk assessment"]
      updateHistory:
        - version: "1.0.0"
          updatedAt: "2024-06-01T08:00:00Z"
          changes: "Initial pattern based on industry observations"
          updatedBy: "intelligence-curator"
        - version: "2.0.0"
          updatedAt: "2024-11-01T10:00:00Z"
          changes: "Promoted after Helpful Content Update validation"
          updatedBy: "pattern-manager"
        - version: "2.1.0"
          updatedAt: "2025-01-18T10:00:00Z"
          changes: "Updated risk thresholds based on 2024 data"
          updatedBy: "pattern-manager"

  - id: risk-keyword-stuffing-v1
    type: algorithm
    category: risk-scores
    name: "Keyword Stuffing Risk Detection"
    description: |
      Keyword density >3%, unnatural keyword placement, or excessive exact-match
      repetition triggers spam signals and ranking penalties.
    confidence: 0.86
    lifecycle: promoted
    version: "1.4.0"
    createdAt: "2024-07-10T09:00:00Z"
    updatedAt: "2025-01-22T11:00:00Z"
    evidence:
      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-07-25T11:30:00Z"
        metrics:
          riskScore: 0.82
          rankingPenalty: 0.70
        notes: "Pages with >3% density dropped avg 7 positions"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-08-18T14:00:00Z"
        metrics:
          riskScore: 0.85
          spamClassificationRate: 0.55
        notes: "55% of high-density pages flagged as spam"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-09-22T10:15:00Z"
        metrics:
          riskScore: 0.88
          manualActionRate: 0.22
        notes: "22% received manual actions for keyword manipulation"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-11-15T15:45:00Z"
        metrics:
          riskScore: 0.84
          recoveryTime: 4.5
        notes: "Average 4.5 months to recover after fixing"

    metadata:
      applicability:
        contentTypes: ["all"]
        industries: ["all"]
      performance:
        successRate: 1.0
        totalApplications: 4
        avgImpact:
          riskScore: 0.848
          avgPenaltySeverity: 0.618
      keywords: ["keyword stuffing", "spam signals", "keyword density", "over-optimization"]

  - id: risk-link-spam-v1
    type: algorithm
    category: risk-scores
    name: "Link Spam Risk Assessment"
    description: |
      Unnatural link patterns (paid links, excessive reciprocal linking,
      irrelevant anchor text) trigger Penguin algorithm penalties.
    confidence: 0.78
    lifecycle: promoted
    version: "1.2.0"
    createdAt: "2024-08-05T10:00:00Z"
    updatedAt: "2025-01-25T12:00:00Z"
    evidence:
      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-08-20T12:00:00Z"
        metrics:
          riskScore: 0.75
          penguinPenaltyRate: 0.68
        notes: "Sites with link spam experienced 68% penalty rate"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-09-28T14:30:00Z"
        metrics:
          riskScore: 0.80
          rankingLoss: 0.72
        notes: "Average ranking loss of 7.2 positions"

      - source: "manual-observation"
        outcome: failure
        capturedAt: "2024-10-18T11:00:00Z"
        metrics:
          riskScore: 0.65
          penguinPenaltyRate: 0.35
        notes: "Lower than expected penalty rate, may need threshold adjustment"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-12-10T09:45:00Z"
        metrics:
          riskScore: 0.78
          disavowEffectiveness: 0.82
        notes: "Disavow tool 82% effective at penalty recovery"

    metadata:
      applicability:
        contentTypes: ["all"]
        industries: ["all"]
      performance:
        successRate: 0.75
        totalApplications: 4
        avgImpact:
          riskScore: 0.745
          avgPenaltySeverity: 0.588
      keywords: ["link spam", "penguin", "backlink quality", "unnatural links"]

