  # ========================================================================
  # RANKING FACTOR PATTERNS
  # ========================================================================

  - id: ranking-backlink-quality-v1
    type: algorithm
    category: ranking-factors
    name: "Backlink Quality vs Quantity"
    description: |
      High-authority, topically relevant backlinks from trusted domains
      outweigh high volume of low-quality links. DR/DA correlation stronger
      than raw backlink count.
    confidence: 0.89
    lifecycle: promoted
    version: "1.3.0"
    createdAt: "2024-09-01T10:00:00Z"
    updatedAt: "2025-01-28T12:00:00Z"
    evidence:
      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-09-20T11:00:00Z"
        metrics:
          qualityCorrelation: 0.82
          quantityCorrelation: 0.45
          drThreshold: 50
        notes: "Links from DR50+ domains showed 82% ranking correlation"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-10-25T14:30:00Z"
        metrics:
          topicalRelevanceBoost: 0.68
          irrelevantLinkImpact: 0.15
        notes: "Topically relevant links 4.5x more effective"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-11-30T10:15:00Z"
        metrics:
          singleHighQualityImpact: 2.8
          tenLowQualityImpact: 0.9
        notes: "1 DR70+ link > 10 DR20- links in ranking impact"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2025-01-22T13:00:00Z"
        metrics:
          sustainedRankingBoost: 0.75
          temporarySpikeLowQuality: 0.20
        notes: "High-quality links maintain rankings long-term"

    metadata:
      applicability:
        contentTypes: ["all"]
        industries: ["all"]
      performance:
        successRate: 1.0
        totalApplications: 4
        avgImpact:
          qualityOverQuantity: 3.625
          sustainedRankingEffect: 0.75
      keywords: ["backlinks", "link quality", "domain authority", "ranking factors"]

  - id: ranking-content-freshness-v1
    type: algorithm
    category: ranking-factors
    name: "Content Freshness Signal"
    description: |
      Regular content updates (not minor date changes) signal freshness
      and relevance. QDF (Query Deserves Freshness) queries strongly
      favor recently updated content.
    confidence: 0.67
    lifecycle: validation
    version: "0.8.0"
    createdAt: "2024-12-01T10:00:00Z"
    updatedAt: "2025-01-28T14:00:00Z"
    evidence:
      - source: "manual-observation"
        outcome: success
        capturedAt: "2024-12-15T11:30:00Z"
        metrics:
          qdfQueryBoost: 0.72
          nonQdfQueryBoost: 0.18
        notes: "QDF queries show strong freshness preference"

      - source: "manual-observation"
        outcome: success
        capturedAt: "2025-01-10T14:00:00Z"
        metrics:
          substantialUpdateBoost: 0.55
          minorDateChangeBoost: 0.08
        notes: "Substantial updates (>20% content change) most effective"

      - source: "manual-observation"
        outcome: failure
        capturedAt: "2025-01-22T10:45:00Z"
        metrics:
          dateOnlyChangeImpact: 0.02
        notes: "Date-only updates without content changes showed minimal impact"

    metadata:
      applicability:
        contentTypes: ["blog-post", "news", "guide", "documentation"]
        industries: ["technology", "news", "finance", "trends"]
      performance:
        successRate: 0.667
        totalApplications: 3
        avgImpact:
          freshnessBoost: 0.483
          qdfQueryAdvantage: 0.72
      keywords: ["content freshness", "qdf", "content updates", "ranking signals"]

  # ========================================================================
