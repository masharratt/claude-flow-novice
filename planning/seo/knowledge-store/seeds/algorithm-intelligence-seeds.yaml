  - id: ranking-user-engagement-v1
    type: algorithm
    category: ranking-factors
    name: "User Engagement Signals (Dwell Time, Pogo-Sticking)"
    description: |
      Time on page, bounce rate, and return-to-SERP behavior (pogo-sticking)
      serve as implicit quality signals. High dwell time correlates with
      better rankings.
    confidence: 0.38
    lifecycle: discovery
    version: "0.2.0"
    createdAt: "2025-01-25T10:00:00Z"
    updatedAt: "2025-01-28T11:00:00Z"
    evidence:
      - source: "manual-observation"
        outcome: success
        capturedAt: "2025-01-28T11:00:00Z"
        metrics:
          dwellTimeCorrelation: 0.62
          pogoStickingPenalty: 0.45
        notes: "Correlation observed but causation unclear"

    metadata:
      applicability:
        contentTypes: ["all"]
        industries: ["all"]
      performance:
        successRate: 1.0
        totalApplications: 1
      keywords: ["user signals", "dwell time", "engagement", "pogo-sticking"]
