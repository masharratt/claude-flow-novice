  - id: linking-hub-spoke-v1
    type: technical
    category: internal-linking
    name: "Hub-and-Spoke Internal Linking"
    description: |
      Creating pillar content (hub) with comprehensive topic coverage,
      linked to specific subtopic pages (spokes), with bidirectional
      contextual linking for authority flow.
    confidence: 0.82
    lifecycle: promoted
    version: "1.3.0"
    createdAt: "2024-09-01T10:00:00Z"
    updatedAt: "2025-01-22T11:00:00Z"
    evidence:
      - source: "https://example.com/javascript-hub"
        outcome: success
        capturedAt: "2024-09-20T12:00:00Z"
        metrics:
          hubRankingImprovement: 3.5
          spokeRankingImprovement: 2.8
          internalPageviews: 4200
          crossLinkingRate: 0.68
        notes: "Hub page ranked #1 for primary keyword, spokes gained visibility"
        domain: "example.com"
        contentType: "pillar-content"

      - source: "https://example.com/react-ecosystem-hub"
        outcome: success
        capturedAt: "2024-10-15T14:30:00Z"
        metrics:
          hubRankingImprovement: 4.2
          spokeRankingImprovement: 3.1
          internalPageviews: 3800
          crossLinkingRate: 0.72
        domain: "example.com"
        contentType: "pillar-content"

      - source: "article-90123"
        outcome: success
        capturedAt: "2024-11-28T10:45:00Z"
        metrics:
          hubRankingImprovement: 2.9
          spokeRankingImprovement: 2.4
          internalPageviews: 2900
          crossLinkingRate: 0.65
        contentType: "pillar-content"

      - source: "article-90150"
        outcome: failure
        capturedAt: "2024-12-18T15:20:00Z"
        metrics:
          hubRankingImprovement: 0.8
          spokeRankingImprovement: 0.5
          internalPageviews: 850
          crossLinkingRate: 0.28
        notes: "Insufficient contextual relevance between hub and spokes"
        contentType: "pillar-content"

    metadata:
      applicability:
        contentTypes: ["pillar-content", "topic-cluster", "resource-hub"]
