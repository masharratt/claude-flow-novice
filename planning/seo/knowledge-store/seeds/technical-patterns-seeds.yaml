  - id: linking-contextual-v1
    type: technical
    category: internal-linking
    name: "Contextual Anchor Text Linking"
    description: |
      Using descriptive, keyword-rich anchor text within content body
      (not footer/sidebar) to pass topical relevance and improve
      target page rankings.
    confidence: 0.71
    lifecycle: validation
    version: "1.0.0"
    createdAt: "2024-11-01T09:00:00Z"
    updatedAt: "2025-01-18T13:00:00Z"
    evidence:
      - source: "https://example.com/typescript-types-linking"
        outcome: success
        capturedAt: "2024-11-15T11:30:00Z"
        metrics:
          targetPageRankingImprovement: 2.3
          anchorTextRelevance: 0.88
          clickThroughRate: 0.045
        notes: "Contextual links from high-authority pages"
        contentType: "guide"

      - source: "article-91234"
        outcome: success
        capturedAt: "2024-12-08T14:00:00Z"
        metrics:
          targetPageRankingImprovement: 1.9
          anchorTextRelevance: 0.82
          clickThroughRate: 0.038
        contentType: "blog-post"

      - source: "article-91260"
        outcome: success
        capturedAt: "2025-01-10T10:15:00Z"
        metrics:
          targetPageRankingImprovement: 2.5
          anchorTextRelevance: 0.91
          clickThroughRate: 0.052
        contentType: "guide"

      - source: "article-91285"
        outcome: failure
