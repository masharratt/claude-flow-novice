  - id: structure-pyramid-v1
    type: content
    category: structure
    name: "Inverted Pyramid Structure"
    description: |
      Presenting most important information first (summary/conclusion),
      then supporting details, then background. Optimizes for featured
      snippets and user experience.
    confidence: 0.65
    lifecycle: validation
    version: "0.9.0"
    createdAt: "2025-01-05T10:00:00Z"
