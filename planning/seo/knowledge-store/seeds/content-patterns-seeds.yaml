  - id: title-power-words-v1
    type: content
    category: title-tags
    name: "Power Words in Title Tags"
    description: |
      Using emotionally compelling power words (proven, ultimate, essential,
      guaranteed, etc.) in title tags to increase CTR from SERP listings.
    confidence: 0.87
    lifecycle: promoted
    version: "1.2.0"
    createdAt: "2024-09-15T10:00:00Z"
    updatedAt: "2025-01-10T14:30:00Z"
    evidence:
      - source: "https://example.com/guide-seo-power-words"
        outcome: success
        capturedAt: "2024-09-20T09:15:00Z"
        metrics:
          ctrIncrease: 0.23
          avgPosition: 4.2
          organicTraffic: 1250
        notes: "Used 'Ultimate' in title, CTR increased 23%"
        contentType: "blog-post"

      - source: "https://example.com/proven-typescript-patterns"
        outcome: success
        capturedAt: "2024-10-05T11:30:00Z"
        metrics:
          ctrIncrease: 0.18
          avgPosition: 3.8
          organicTraffic: 980
        notes: "Used 'Proven' in title, strong engagement"
        contentType: "guide"

      - source: "https://example.com/essential-react-hooks"
        outcome: success
        capturedAt: "2024-11-12T16:45:00Z"
        metrics:
          ctrIncrease: 0.31
          avgPosition: 2.5
          organicTraffic: 2100
        notes: "Used 'Essential' in title, achieved featured snippet"
        contentType: "guide"

      - source: "article-12345"
        outcome: success
        capturedAt: "2024-12-20T10:00:00Z"
        metrics:
          ctrIncrease: 0.15
          avgPosition: 5.1
        contentType: "blog-post"

      - source: "article-12389"
        outcome: failure
        capturedAt: "2025-01-05T13:20:00Z"
        metrics:
          ctrIncrease: 0.02
          avgPosition: 8.7
        notes: "Power word didn't resonate with technical audience"
        contentType: "technical-documentation"

    metadata:
      applicability:
        contentTypes: ["blog-post", "guide", "landing-page", "pillar-content"]
